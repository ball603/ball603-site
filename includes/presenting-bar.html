<!-- Ball603 Presenting Sponsor Bar -->
<!-- Injected by nav-loader.js after the site header -->
<!-- Auto-rotates through presenting sponsors every 5 seconds -->

<div id="presenting-sponsor-bar" style="display:none;">
  <style>
    #presenting-sponsor-bar {
      width: 100%;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      border-bottom: 2px solid var(--brand-orange, #f57c00);
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .psb-label {
      font-size: 10px;
      font-weight: 700;
      color: #888;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .psb-sponsor {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      opacity: 0;
      transition: opacity 0.4s ease;
      position: absolute;
    }
    .psb-sponsor.active {
      opacity: 1;
      position: relative;
    }
    .psb-sponsor img {
      height: 26px;
      max-width: 100px;
      object-fit: contain;
      filter: brightness(1.1);
    }
    .psb-sponsor-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .psb-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
      padding: 0 16px;
      position: relative;
      min-height: 44px;
    }
    .psb-dots {
      display: flex;
      gap: 5px;
      margin-left: 14px;
      flex-shrink: 0;
    }
    .psb-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    .psb-dot.active {
      background: var(--brand-orange, #f57c00);
    }
    @media (max-width: 480px) {
      .psb-sponsor-name { display: none; }
      .psb-label { font-size: 9px; margin-right: 10px; }
    }
  </style>

  <div class="psb-inner">
    <span class="psb-label">Presenting Sponsor</span>
    <div id="psb-sponsors-wrap" style="display:flex; align-items:center; position:relative; min-width:200px; min-height:30px;"></div>
    <div class="psb-dots" id="psb-dots"></div>
  </div>
</div>

<script>
(function() {
  let psbSponsors = [];
  let psbIndex = 0;
  let psbTimer = null;

  async function initPresentingBar() {
    try {
      const res = await fetch('/.netlify/functions/get-sponsors?tier=presenting');
      const data = await res.json();
      psbSponsors = data.sponsors || [];
    } catch (e) {
      psbSponsors = [];
    }

    if (psbSponsors.length === 0) return;

    const bar = document.getElementById('presenting-sponsor-bar');
    const wrap = document.getElementById('psb-sponsors-wrap');
    const dotsEl = document.getElementById('psb-dots');

    // Shuffle for variety
    psbSponsors = psbSponsors.sort(() => Math.random() - 0.5);

    // Build sponsor elements
    wrap.innerHTML = psbSponsors.map((s, i) => `
      <a href="${s.url || '#'}" target="_blank" rel="noopener"
         class="psb-sponsor${i === 0 ? ' active' : ''}"
         id="psb-s-${i}" title="${s.name}">
        ${s.logo_url ? `<img src="${s.logo_url}" alt="${s.name}" onerror="this.style.display='none'">` : ''}
        <span class="psb-sponsor-name">${s.name}</span>
      </a>
    `).join('');

    // Build dots (only if >1 sponsor)
    if (psbSponsors.length > 1) {
      dotsEl.innerHTML = psbSponsors.map((_, i) =>
        `<div class="psb-dot${i === 0 ? ' active' : ''}" id="psb-dot-${i}"></div>`
      ).join('');
      psbTimer = setInterval(psbRotate, 5000);
    }

    bar.style.display = 'flex';
  }

  function psbRotate() {
    const prev = psbIndex;
    psbIndex = (psbIndex + 1) % psbSponsors.length;

    const prevEl = document.getElementById(`psb-s-${prev}`);
    const nextEl = document.getElementById(`psb-s-${psbIndex}`);
    const prevDot = document.getElementById(`psb-dot-${prev}`);
    const nextDot = document.getElementById(`psb-dot-${psbIndex}`);

    if (prevEl) prevEl.classList.remove('active');
    if (nextEl) nextEl.classList.add('active');
    if (prevDot) prevDot.classList.remove('active');
    if (nextDot) nextDot.classList.add('active');
  }

  // Init after DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPresentingBar);
  } else {
    initPresentingBar();
  }
})();
</script>
