<!-- Ball603 Presenting Sponsor Bar -->
<!-- Injected by nav-loader.js after the scores ticker (or header if no ticker) -->
<!-- JS logic lives in nav-loader.js — scripts in insertAdjacentHTML don't execute -->

<div id="presenting-sponsor-bar" style="display:none;">
  <style>
    #presenting-sponsor-bar {
      width: 100%;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      border-bottom: 2px solid var(--brand-orange, #f57c00);
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .psb-sponsor {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
      opacity: 0;
      transition: opacity 0.4s ease;
      position: absolute;
    }
    .psb-sponsor.active {
      opacity: 1;
      position: relative;
    }
    .psb-sponsor img {
      height: 52px;
      max-width: 180px;
      object-fit: contain;
      filter: brightness(1.1);
    }
    .psb-sponsor-name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .psb-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
      padding: 0 16px;
      position: relative;
      min-height: 88px;
    }
    .psb-dots {
      display: flex;
      gap: 5px;
      margin-left: 16px;
      flex-shrink: 0;
    }
    .psb-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    .psb-dot.active {
      background: var(--brand-orange, #f57c00);
    }
    @media (max-width: 480px) {
      #presenting-sponsor-bar { height: 70px; }
      .psb-inner { min-height: 70px; }
      .psb-sponsor img { height: 38px; max-width: 130px; }
      .psb-sponsor-name { font-size: 13px; }
    }
  </style>
  <div class="psb-inner">
    <div id="psb-sponsors-wrap" style="display:flex; align-items:center; position:relative; min-width:200px; min-height:52px;"></div>
    <div class="psb-dots" id="psb-dots"></div>
  </div>
</div>
