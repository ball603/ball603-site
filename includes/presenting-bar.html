<!-- Ball603 Presenting Sponsor Bar -->
<!-- Injected by nav-loader.js after the scores ticker (or header if no ticker) -->
<!-- JS logic lives in nav-loader.js — scripts in insertAdjacentHTML don't execute -->

<div id="presenting-sponsor-bar" style="display:none;">
  <style>
    #presenting-sponsor-bar {
      width: 100%;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      border-bottom: 2px solid var(--brand-orange, #f57c00);
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .psb-inner {
      width: 100%;
      max-width: 1200px;
      height: 92px;
      position: relative;
    }
    .psb-sponsor {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    .psb-sponsor.active {
      opacity: 1;
      pointer-events: auto;
    }
    /* White tile behind every logo — see the note on #team-sponsor-bar img in
       team/team.html. The tile goes on the <img> rather than the <a> because
       .psb-sponsor is absolutely positioned across the whole bar. */
    /* box-sizing is border-box site-wide (styles.css), so this height is the
       WHOLE white tile — padding included. At the old 56px with 9px top and
       bottom, the artwork itself only ever got 38px, which is why a square
       mark like Summit Six was unreadable while a wide one like New England
       Furniture looked fine: the wide logo spends its pixels on width, the
       square one has nowhere to go. Taller tile, thinner padding, and the
       artwork roughly doubles without the bar growing. */
    .psb-sponsor img {
      height: 76px;
      max-width: 250px;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
      padding: 5px 10px;
    }
    @media (max-width: 480px) {
      #presenting-sponsor-bar { height: 72px; }
      .psb-inner { height: 72px; }
      .psb-sponsor img { height: 60px; max-width: 180px; padding: 4px 8px; }
    }
  </style>
  <div class="psb-inner">
    <div id="psb-sponsors-wrap"></div>
  </div>
</div>
