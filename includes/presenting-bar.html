<!-- Ball603 Presenting Sponsor Bar -->
<!-- Injected by nav-loader.js after the site header -->
<!-- NOTE: Script is intentionally in nav-loader.js — scripts in insertAdjacentHTML don't execute -->

<div id="presenting-sponsor-bar" style="display:none;">
  <style>
    #presenting-sponsor-bar {
      width: 100%;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      border-bottom: 2px solid var(--brand-orange, #f57c00);
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .psb-label {
      font-size: 10px;
      font-weight: 700;
      color: #888;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .psb-sponsor {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      opacity: 0;
      transition: opacity 0.4s ease;
      position: absolute;
    }
    .psb-sponsor.active {
      opacity: 1;
      position: relative;
    }
    .psb-sponsor img {
      height: 26px;
      max-width: 100px;
      object-fit: contain;
      filter: brightness(1.1);
    }
    .psb-sponsor-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .psb-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
      padding: 0 16px;
      position: relative;
      min-height: 44px;
    }
    .psb-dots {
      display: flex;
      gap: 5px;
      margin-left: 14px;
      flex-shrink: 0;
    }
    .psb-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    .psb-dot.active {
      background: var(--brand-orange, #f57c00);
    }
    @media (max-width: 480px) {
      .psb-sponsor-name { display: none; }
      .psb-label { font-size: 9px; margin-right: 10px; }
    }
  </style>
  <div class="psb-inner">
    <span class="psb-label">Presenting Sponsor</span>
    <div id="psb-sponsors-wrap" style="display:flex; align-items:center; position:relative; min-width:200px; min-height:30px;"></div>
    <div class="psb-dots" id="psb-dots"></div>
  </div>
</div>
