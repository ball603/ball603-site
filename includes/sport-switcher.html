<!-- Sport Switcher - Ball603 -->
<!-- Hidden by default. Only shown when multi_sport_enabled = true -->
<div class="sport-switcher" id="sportSwitcher" style="display: none;">
  <div class="sport-switcher-inner">
    
    <!-- Basketball -->
    <button class="sport-btn" data-sport="basketball" title="Basketball">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M12 2C12 12 12 12 12 22" stroke="currentColor" stroke-width="1.5"/>
        <path d="M2 12C12 12 12 12 22 12" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4.5 4.5C8 8 8 16 4.5 19.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M19.5 4.5C16 8 16 16 19.5 19.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
      </svg>
      <span>Basketball</span>
    </button>
    
    <!-- Baseball -->
    <button class="sport-btn" data-sport="baseball" title="Baseball">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M5 5.5C7 8 7 16 5 18.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M19 5.5C17 8 17 16 19 18.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M6 6L6.5 7M6 10L6.5 11M6 14L6.5 15M6 18L6.5 17" stroke="currentColor" stroke-width="1"/>
        <path d="M18 6L17.5 7M18 10L17.5 11M18 14L17.5 15M18 18L17.5 17" stroke="currentColor" stroke-width="1"/>
      </svg>
      <span>Baseball</span>
    </button>
    
    <!-- Girls Volleyball -->
    <button class="sport-btn" data-sport="gvolleyball" title="Girls Volleyball">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M12 2C12 7 7 12 2 12" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M12 2C12 7 17 12 22 12" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M2 12C7 12 12 17 12 22" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M22 12C17 12 12 17 12 22" stroke="currentColor" stroke-width="1.5" fill="none"/>
      </svg>
      <span>Girls Volleyball</span>
    </button>
    
  </div>
</div>
