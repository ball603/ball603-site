<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>News | Farmington Tigers</title>
<meta name="description" content="Farmington Tigers news and announcements.">
<link rel="canonical" href="https://ball603.com/farmingtontigersnh/news">
<link rel="icon" href="/logos/100px/Farmington.png">
<!-- Installable app. The manifest link is set by farmington.js rather than
     written here, because its path depends on which of the two Tigers hosts you
     are on; everything below is the same either way. -->
<meta name="theme-color" content="#000000">
<!-- iOS reads these, not the manifest, and it keeps whichever one it grabbed
     when the page was first added to the Home Screen. Sizes are spelled out so
     Safari picks the right one rather than scaling the 180 down. -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/farmington/v2/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/farmington/v2/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/farmington/v2/apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/farmington/v2/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/farmington/v2/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tigers">
<link rel="stylesheet" href="/farmington.css">
</head>
<body>

<div id="ft-header"></div>

<main class="ft-wrap">
  <div class="ft-pagehead"><h1>News</h1></div>

  <!-- Placeholder by design. Pulling Facebook posts into this layout needs a
       Meta app and a page token; until that exists the page sends people to
       the source rather than pretending to have the posts. -->
  <div class="ft-card">
    <div class="ft-placeholder">
      Tigers news is posted to Facebook.<br>
      <a href="https://www.facebook.com/FarmingtonTigersNH/" target="_blank" rel="noopener">
        Follow the Tigers on Facebook &rarr;</a>
      <p style="margin-top:18px;font-size:13px">
        Also on
        <a href="https://www.instagram.com/farmingtontigersnh/" target="_blank" rel="noopener">Instagram</a>
        and <a href="https://x.com/FHStigersnh" target="_blank" rel="noopener">X</a>.
      </p>
    </div>
  </div>
</main>

<div id="ft-footer"></div>

<script src="/farmington.js"></script>
<script>
FT.renderHeader('news');
FT.renderFooter();
</script>
</body>
</html>
