<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball603 Baseball - Coming Soon</title>
  <link rel="icon" type="image/png" href="/logo.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .splash-container {
      text-align: center;
      position: relative;
      z-index: 10;
    }
    
    /* Splash text images */
    .splash-text {
      height: auto;
      opacity: 0;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    
    /* Top text - comes in from above */
    #splashText1 {
      width: clamp(220px, 50vw, 600px);
      transform: translateY(-50px);
      margin-bottom: 40px;
    }
    
    #splashText1.visible {
      animation: textSlideDown 0.8s ease forwards;
    }
    
    @keyframes textSlideDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Bottom text - positioned higher */
    #splashText2 {
      width: clamp(240px, 55vw, 650px);
      transform: translateY(30px);
      margin-top: -10px;
    }
    
    #splashText2.visible {
      animation: textFadeIn 0.8s ease forwards;
    }
    
    @keyframes textFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Baseball logo */
    .baseball-logo {
      width: clamp(380px, 55vw, 600px);
      height: auto;
      opacity: 0;
      transform: translateY(-200px) scale(0.5);
      filter: drop-shadow(0 0 0 transparent);
    }
    
    .baseball-logo.drop {
      animation: baseballDrop 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    
    @keyframes baseballDrop {
      0% {
        opacity: 0;
        transform: translateY(-200px) scale(0.5) rotate(-20deg);
        filter: drop-shadow(0 0 0 transparent);
      }
      60% {
        opacity: 1;
        transform: translateY(20px) scale(1.05) rotate(5deg);
      }
      80% {
        transform: translateY(-10px) scale(0.98) rotate(-2deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));
      }
    }
    
    /* Impact flash */
    .impact-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(245,124,0,0.3) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }
    
    .impact-flash.flash {
      animation: impactFlash 0.4s ease-out forwards;
    }
    
    @keyframes impactFlash {
      0% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 0; }
    }
    
    /* Floating background particles */
    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }
    
    .particle {
      position: absolute;
      border-radius: 50%;
    }
    
    .particle.orange {
      background: #f57c00;
      opacity: 0.4;
    }
    
    .particle.white {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .particle.float-1 { animation: floatAround1 20s infinite ease-in-out; }
    .particle.float-2 { animation: floatAround2 18s infinite ease-in-out; }
    .particle.float-3 { animation: floatAround3 22s infinite ease-in-out; }
    .particle.float-4 { animation: floatAround4 19s infinite ease-in-out; }
    
    @keyframes floatAround1 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(30px, -40px); }
      50% { transform: translate(-20px, -60px); }
      75% { transform: translate(-40px, -20px); }
    }
    
    @keyframes floatAround2 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-35px, -25px); }
      50% { transform: translate(25px, -50px); }
      75% { transform: translate(40px, 10px); }
    }
    
    @keyframes floatAround3 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(20px, 30px); }
      50% { transform: translate(-30px, -30px); }
      75% { transform: translate(-15px, 40px); }
    }
    
    @keyframes floatAround4 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-25px, 35px); }
      50% { transform: translate(35px, 20px); }
      75% { transform: translate(15px, -35px); }
    }
    
    /* Vignette overlay */
    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 2;
    }
    
    /* Fade out the whole splash */
    .splash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }
    
    .splash-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    /* Skip button */
    .skip-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 10px 20px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 110;
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    .skip-btn.visible {
      opacity: 1;
    }
    
    .skip-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }
    
    /* Tap to start overlay */
    .tap-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .tap-overlay.hidden {
      display: none;
    }
    
    .tap-content {
      text-align: center;
    }
    
    .tap-icon {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
      animation: tapPulse 2s ease-in-out infinite;
    }
    
    .tap-text {
      font-size: 24px;
      color: #fff;
      font-weight: 600;
      letter-spacing: 2px;
    }
    
    @keyframes tapPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    
  </style>
</head>
<body>
  
  <div class="splash-overlay" id="splashOverlay">
    <div class="vignette"></div>
    <div class="impact-flash" id="impactFlash"></div>
    <div class="particles-bg" id="particlesBg"></div>
    
    <div class="splash-container">
      <img src="/logos/Splash1.png" alt="There's a new BALL in town..." class="splash-text" id="splashText1">
      
      <img src="/logos/Ball603-Baseball-real-no-shadow.png" alt="Ball603 Baseball" class="baseball-logo" id="baseballLogo">
      
      <img src="/logos/Splash2.png" alt="Baseball in the Granite State" class="splash-text subtext" id="splashText2">
    </div>
  </div>
  
  <button class="skip-btn" id="skipBtn" onclick="skipSplash()">Skip &#8594;</button>
  
  <!-- Tap to start overlay (for mobile audio) -->
  <div class="tap-overlay" id="tapOverlay" onclick="startWithAudio()">
    <div class="tap-content">
      <img src="/logos/Ball603outline.png" alt="Ball603" class="tap-icon">
      <div class="tap-text">Tap to Start</div>
    </div>
  </div>
  
  <!-- Sound effect -->
  <audio id="batSound" preload="auto">
    <source src="/logos/baseball.mp3" type="audio/mpeg">
  </audio>
  
  <script>
    // TESTING MODE - localStorage disabled, refresh freely
    // TODO: Uncomment for production
    // const hasSeenSplash = localStorage.getItem('ball603_baseball_splash_seen');
    const hasSeenSplash = false; // Always show during testing
    
    if (hasSeenSplash) {
      // Skip directly to homepage
      window.location.href = '/index.html';
    }
    // Animation waits for tap to start (for mobile audio unlock)
    
    function startWithAudio() {
      // Hide tap overlay
      document.getElementById('tapOverlay').classList.add('hidden');
      // Start animation
      runSplashAnimation();
    }
    
    function runSplashAnimation() {
      const splashText1 = document.getElementById('splashText1');
      const logo = document.getElementById('baseballLogo');
      const flash = document.getElementById('impactFlash');
      const splashText2 = document.getElementById('splashText2');
      const skipBtn = document.getElementById('skipBtn');
      
      // Start audio immediately (bat crack is at ~1.8s in the file)
      const batSound = document.getElementById('batSound');
      batSound.currentTime = 0;
      batSound.play().catch(e => console.log('Audio autoplay blocked:', e));
      
      // Show skip button after 2 seconds
      setTimeout(() => {
        skipBtn.classList.add('visible');
      }, 2000);
      
      // Show first text (There's a new BALL in town...)
      setTimeout(() => {
        splashText1.classList.add('visible');
      }, 400);
      
      // Drop the baseball (syncs with bat crack at 1.8s in audio)
      setTimeout(() => {
        logo.classList.add('drop');
        
        // Trigger impact flash when ball "lands"
        setTimeout(() => {
          flash.classList.add('flash');
        }, 600);
        
      }, 1800);
      
      // Show bottom text (BASEBALL in the Granite State)
      setTimeout(() => {
        splashText2.classList.add('visible');
      }, 3500);
      
      // Fade out and show main content (extended by 2 seconds for longer particles)
      setTimeout(() => {
        completeSplash();
      }, 8000);
    }
    
    function createBackgroundParticles() {
      const container = document.getElementById('particlesBg');
      if (!container) return;
      const colorTypes = ['orange', 'white'];
      const floatTypes = ['float-1', 'float-2', 'float-3', 'float-4'];
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = `particle ${colorTypes[i % colorTypes.length]} ${floatTypes[Math.floor(Math.random() * floatTypes.length)]}`;
        const size = Math.random() * 6 + 3;
        particle.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*20}s`;
        container.appendChild(particle);
      }
    }
    
    // Create particles immediately
    createBackgroundParticles();
    
    function skipSplash() {
      completeSplash();
    }
    
    function completeSplash() {
      // Mark as seen - DISABLED FOR TESTING
      // TODO: Uncomment for production
      // localStorage.setItem('ball603_baseball_splash_seen', 'true');
      
      // Fade out splash
      const overlay = document.getElementById('splashOverlay');
      const skipBtn = document.getElementById('skipBtn');
      const splashText1 = document.getElementById('splashText1');
      const logo = document.getElementById('baseballLogo');
      const flash = document.getElementById('impactFlash');
      const splashText2 = document.getElementById('splashText2');
      
      overlay.classList.add('fade-out');
      skipBtn.style.opacity = '0';
      
      // Redirect to homepage - DISABLED FOR TESTING
      // TODO: Uncomment for production
      // setTimeout(() => {
      //   window.location.href = '/index.html';
      // }, 800);
      
      // For testing: just reset the splash elements after fade, then replay
      setTimeout(() => {
        overlay.classList.remove('fade-out');
        splashText1.classList.remove('visible');
        logo.classList.remove('drop');
        flash.classList.remove('flash');
        splashText2.classList.remove('visible');
        skipBtn.classList.remove('visible');
        skipBtn.style.opacity = '';
        // Reset audio
        document.getElementById('batSound').pause();
        document.getElementById('batSound').currentTime = 0;
        // Auto-replay
        setTimeout(() => runSplashAnimation(), 500);
      }, 1000);
    }
    
    // For testing: Press 'R' to reset and replay
    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        localStorage.removeItem('ball603_baseball_splash_seen');
        location.reload();
      }
    });
  </script>
</body>
</html>
