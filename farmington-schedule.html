<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Schedule | Farmington Tigers</title>
<meta name="description" content="Full schedule and results for every Farmington Tigers team.">
<link rel="icon" href="/logos/100px/Farmington.png">
<link rel="stylesheet" href="/farmington.css">
</head>
<body>

<div id="ft-header"></div>

<main class="ft-wrap">
  <div class="ft-pagehead"><h1>Schedule</h1></div>

  <div class="ft-pillrow ft-center" id="sportChips"></div>
  <div class="ft-pillrow ft-center" id="genderPills"></div>
  <div class="ft-pillrow ft-center" id="teamPicker"></div>

  <div id="scheduleBody"><div class="ft-loading">Loading the Tigers schedule&hellip;</div></div>
</main>

<div id="ft-footer"></div>

<script src="/farmington.js"></script>
<script>
'use strict';

FT.renderHeader('schedule');
FT.renderFooter();

let DATA = null;
const state = { sport: null, gender: null, uteam: null };

/* ── Controls ──────────────────────────────────────────────────────────── */

function renderSportChips() {
  const items = [{ value: 'all', label: 'All Sports', emoji: '\u{1F405}' }].concat(
    DATA.sports.map(id => ({ value: id, label: FT.SPORTS[id].name, emoji: FT.SPORTS[id].emoji })));
  document.getElementById('sportChips').innerHTML = FT.pills(items, state.sport, 'data-sport');
}

/* Basketball runs Boys and Girls at both varsity and JV, so a single row of
   levels would read "Varsity, Varsity, JV, JV". Splitting gender out first —
   the way the standings page splits divisions — leaves the level row saying
   only what the level is. Sports with one gender skip the row entirely. */
function renderGenderPills() {
  const el = document.getElementById('genderPills');
  if (state.sport === 'all') { el.innerHTML = ''; return; }
  const genders = DATA.gendersInSport(state.sport);
  el.innerHTML = genders.length > 1
    ? FT.pills(genders.map(g => ({ value: g, label: g })), state.gender, 'data-gender')
    : '';
}

function levelTeams() {
  if (state.sport === 'all') return [];
  const teams = DATA.teamsInSport(state.sport);
  const genders = DATA.gendersInSport(state.sport);
  return genders.length > 1 ? teams.filter(t => t.gender === state.gender) : teams;
}

/* Varsity first, then JV, then Jr. High — the order farmington_teams carries,
   so the levels read the way the athletic department lists its teams. */
function renderTeamPicker() {
  const el = document.getElementById('teamPicker');
  // All Sports is every team at once, so there is no level to pick.
  if (state.sport === 'all') { el.innerHTML = ''; return; }
  const teams = levelTeams();
  if (teams.length < 2) { el.innerHTML = ''; return; }
  el.innerHTML = FT.pills(
    teams.map(t => ({ value: t.uteam, label: t.level || t.name })), state.uteam, 'data-team');
}

/* ── The black bar ─────────────────────────────────────────────────────── */
/* What you are looking at on the left, how they have done on the right — the
   same shape as the standings card. Last game and next game are gone; the table
   underneath already says both, in order. */

function cardBar(team, games) {
  const rec = FT.recordOf(games);
  const title = team ? team.name : 'Every Team';
  // Bullets rather than bare spacing: four numbers in a row need something
  // between them or they read as one long figure.
  const dot = '<i class="ft-bardot">&bull;</i>';
  const right = rec.played ? `
    <span class="ft-barstats">
      <b>${rec.text}</b>${dot}
      <span>${rec.home} <em>Home</em></span>${dot}
      <span>${rec.away} <em>Away</em></span>${dot}
      ${FT.streakBadge(rec.streak)}
    </span>` : '';
  return `<div class="ft-cardbar"><h2>${FT.esc(title)}</h2>${right}</div>`;
}

/* ── The schedule table ────────────────────────────────────────────────── */

function renderSchedule() {
  const all = state.sport === 'all';
  const team = all ? null : DATA.teamsById.get(state.uteam);
  const games = all ? DATA.games : (team ? team.games.filter(g => g.sport_id === state.sport) : []);
  const body = document.getElementById('scheduleBody');

  // A record blending varsity, JV and Jr. High is a number nobody means, so the
  // bar carries no stats in All Sports.
  const bar = all ? '<div class="ft-cardbar"><h2>Every Team</h2></div>' : cardBar(team, games);

  if (!games.length) {
    body.innerHTML = `<div class="ft-card">${bar}<div class="ft-empty">No games on the schedule for this team yet.</div></div>`;
    return;
  }

  const today = FT.todayKey();
  const next = games.find(g => !FT.scoreOf(g) && g.game_date >= today);

  body.innerHTML = `
    <div class="ft-card">${bar}
    <table class="ft-table">
      <thead><tr>
        <th>Date</th>
        <th class="ctr" aria-label="Sport"></th>
        <th>Level</th>
        <th class="ft-hide-sm">Gender</th>
        <th class="grow">Match-up</th>
        <th>Time/Result</th>
        <th class="ft-hide-sm">Location</th>
      </tr></thead>
      <tbody>${games.map(g => row(g, g === next)).join('')}</tbody>
    </table></div>`;
}

function row(g, isNext) {
  const sc = FT.scoreOf(g);
  const res = FT.resultOf(sc);

  const timeOrResult = sc
    ? `<span class="ft-result"><span class="${res}">${res}</span> ${sc.us}–${sc.them}</span>${
        sc.manual ? '<span class="ft-manual" title="Score entered by hand">●</span>' : ''}`
    : FT.esc(FT.timeLabel(g.starts_at));

  const status = (g.game_status && g.game_status !== 'Normal')
    ? `<div class="ft-status">${FT.esc(g.game_status)}</div>` : '';

  const site = g.site_name || '';
  const sub = (g.sub_site_name && g.sub_site_name !== site) ? g.sub_site_name : '';
  const venueText = sub ? `${site} — ${sub}` : site;

  return `
    <tr class="${isNext ? 'ft-next' : ''}">
      <td class="ft-datecell"><b>${FT.esc(FT.shortDate(g.game_date))}</b>${FT.esc(weekday(g.game_date))}</td>
      <td class="ctr"><span class="ft-sport-emoji" title="${FT.esc(g.sport.name)}">${g.sport.emoji}</span></td>
      <td><span class="ft-level">${FT.esc(g.team.level || '')}</span></td>
      <td class="ft-hide-sm"><span class="ft-level">${FT.esc(FT.genderLabel(g.gender_id, g.sport_id))}</span></td>
      <td class="grow"><div class="ft-matchup">${matchup(g)}</div></td>
      <td>${timeOrResult}${status}</td>
      <td class="ft-hide-sm">
        <div class="ft-venue-cell">${venueText ? `<span>${FT.esc(venueText)}</span>` : ''}${FT.venuePin(g)}</div>
      </td>
    </tr>`;
}

function weekday(key) {
  const d = FT.parseLocal(key);
  return d ? d.toLocaleDateString('en-US', { weekday: 'short' }) : '';
}

function matchup(g) {
  if (g.is_meet) return FT.esc(FT.opponentLabel(g));
  if (!g.opponent_name) return `<span class="ft-tba">${FT.esc(FT.opponentLabel(g))}</span>`;

  const short = g.opponent_ball603;
  const label = FT.opponentLabel(g);
  // Arbiter's own school art, where the opponent has any.
  const img = g.opponent_entity_id
    ? `<img class="ft-oppimg" src="https://assets.arbitersports.com/logos/school/${encodeURIComponent(g.opponent_entity_id)}.jpg"
            alt="" onerror="this.remove()">`
    : (short ? `<img class="ft-oppimg" src="${FT.esc(FT.ball603Logo(short))}" alt="" onerror="this.remove()">` : '');

  return `<span class="ft-ha${g.is_home ? ' home' : ''}">${g.is_home ? 'vs' : 'at'}</span>
          ${img}${FT.teamLink(short, g.sport_id, label)}`;
}

/* ── Wiring ────────────────────────────────────────────────────────────── */

document.getElementById('sportChips').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  FT.closeVenue();
  state.sport = btn.dataset.sport === 'all' ? 'all' : Number(btn.dataset.sport);
  pickDefaults();
  syncUrl();
  renderSportChips(); renderGenderPills(); renderTeamPicker(); renderSchedule();
});

document.getElementById('genderPills').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  FT.closeVenue();
  state.gender = btn.dataset.gender;
  const teams = levelTeams();
  const varsity = teams.find(t => t.level_rank === 1) || teams[0];
  state.uteam = varsity ? varsity.uteam : null;
  syncUrl();
  renderGenderPills(); renderTeamPicker(); renderSchedule();
});

/* Picking a sport lands on its varsity side, and on the first gender it is
   played at. `keepGender` is only for restoring a link: choosing a new sport
   resets the gender, because carrying "Girls" over from volleyball into
   basketball would silently open the girls team when somebody clicked
   Basketball. */
function pickDefaults(keepGender) {
  if (state.sport === 'all') { state.gender = null; state.uteam = null; return; }
  const genders = DATA.gendersInSport(state.sport);
  if (!keepGender || !genders.includes(state.gender)) state.gender = genders[0] || null;
  const teams = levelTeams();
  const varsity = teams.find(t => t.level_rank === 1) || teams[0];
  state.uteam = varsity ? varsity.uteam : null;
}

document.getElementById('teamPicker').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  FT.closeVenue();
  state.uteam = Number(btn.dataset.team);
  syncUrl();
  renderGenderPills();
  renderTeamPicker();
  renderSchedule();
});

// A sport and team in the address bar, so a link to "the volleyball schedule"
// opens on volleyball rather than on whatever plays next.
function syncUrl() {
  const q = new URLSearchParams({ sport: state.sport, team: state.uteam });
  history.replaceState(null, '', location.pathname + '?' + q);
}

function openingState() {
  const q = new URLSearchParams(location.search);
  const wantSport = Number(q.get('sport'));
  const wantTeam = Number(q.get('team'));

  if (new URLSearchParams(location.search).get('sport') === 'all') {
    state.sport = 'all';
    state.uteam = null;
    return;
  }
  if (DATA.sports.includes(wantSport)) {
    state.sport = wantSport;
  } else {
    // Whatever plays next, so the page is useful the moment it opens — but
    // preferring a sport that has a varsity side. Landing on Jr. High cross
    // country because its meet happens to be the very next event is a worse
    // front door than the varsity soccer game later the same day.
    const today = FT.todayKey();
    const upcoming = DATA.games.filter(g => g.game_date >= today);
    const next = upcoming.find(g => DATA.hasVarsity(g.sport_id)) || upcoming[0];
    state.sport = next ? next.sport_id : (DATA.sports[0] ?? null);
  }

  const inSport = DATA.teamsInSport(state.sport);
  const picked = inSport.find(t => t.uteam === wantTeam);
  if (picked) {
    state.gender = picked.gender;
    state.uteam = picked.uteam;
  } else {
    pickDefaults(true);
  }
}

FT.load().then(data => {
  DATA = data;
  if (!DATA.sports.length) {
    document.getElementById('scheduleBody').innerHTML =
      '<div class="ft-empty">No Tigers games have been published yet.</div>';
    return;
  }
  openingState();
  renderSportChips(); renderGenderPills(); renderTeamPicker(); renderSchedule();
}).catch(err => {
  console.error('Tigers schedule failed to load:', err);
  document.getElementById('scheduleBody').innerHTML =
    '<div class="ft-empty">The schedule could not be loaded just now. Please refresh in a moment.</div>';
});
</script>
</body>
</html>
