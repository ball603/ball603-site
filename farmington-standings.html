<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Standings | Farmington Tigers</title>
<meta name="description" content="Varsity standings for every sport the Farmington Tigers play.">
<link rel="canonical" href="https://ball603.com/farmingtontigersnh/standings">
<link rel="icon" href="/logos/100px/Farmington.png">
<!-- Installable app. The manifest link is set by farmington.js rather than
     written here, because its path depends on which of the two Tigers hosts you
     are on; everything below is the same either way. -->
<meta name="theme-color" content="#000000">
<!-- iOS reads these, not the manifest, and it keeps whichever one it grabbed
     when the page was first added to the Home Screen. Sizes are spelled out so
     Safari picks the right one rather than scaling the 180 down. -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/farmington/v2/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/farmington/v2/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/farmington/v2/apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/farmington/v2/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/farmington/v2/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tigers">
<link rel="stylesheet" href="/farmington.css">
</head>
<body>

<div id="ft-header"></div>

<main class="ft-wrap">
  <div class="ft-pagehead"><h1>Standings</h1></div>

  <div class="ft-pillrow ft-center" id="sportPills"></div>
  <div class="ft-pillrow ft-center" id="divisionPills"></div>
  <div id="standBody"><div class="ft-loading">Loading standings&hellip;</div></div>
</main>

<div id="ft-footer"></div>

<script src="/farmington.js"></script>
<!-- The table itself. Shared with the team pages, which show the same standings
     for one team's sport. -->
<script src="/farmington-standings.js"></script>
<script>
'use strict';

FT.renderHeader('standings');
FT.renderFooter();

let DATA = null;
let sports = [];
const state = { sport: null, division: null };

const currentSport = () => sports.find(s => s.key === state.sport);
const currentDivision = () => {
  const s = currentSport();
  return s && (s.divisions.find(d => d.id === state.division) || s.divisions[0]);
};
const renderTable = () => FTStandings.renderTable('standBody', currentSport(), currentDivision());

/* ── Rendering ─────────────────────────────────────────────────────────── */

function renderPills() {
  document.getElementById('sportPills').innerHTML = FT.pills(
    sports.map(s => ({ value: s.key, label: s.label, emoji: s.emoji })), state.sport, 'data-sport');

  const sport = currentSport();
  const el = document.getElementById('divisionPills');
  // One division is not a choice, so no row of pills for it.
  el.innerHTML = (sport && sport.divisions.length > 1)
    ? FT.pills(sport.divisions.map(d => ({ value: d.id, label: FT.divisionLabel(d.name) })), currentDivision().id, 'data-division')
    : '';
}

/* ── Wiring ────────────────────────────────────────────────────────────── */

function syncUrl() {
  history.replaceState(null, '', location.pathname + '?' +
    new URLSearchParams({ sport: state.sport, division: state.division }));
}

document.getElementById('sportPills').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  state.sport = btn.dataset.sport;
  // Farmington's own division where they have one, so switching sport lands on
  // the table somebody actually came to see.
  const sport = currentSport();
  const mine = sport.divisions.find(d => d.rows.some(r => r.is_farmington));
  state.division = (mine || sport.divisions[0]).id;
  syncUrl(); renderPills(); renderTable();
});

document.getElementById('divisionPills').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  state.division = btn.dataset.division;
  syncUrl(); renderPills(); renderTable();
});

FT.load().then(data => {
  DATA = data;
  sports = FTStandings.buildSports(DATA);
  if (!sports.length) {
    document.getElementById('standBody').innerHTML =
      '<div class="ft-card"><div class="ft-empty">No varsity standings are posted right now. ' +
      'Standings appear only while a sport is in season.</div></div>';
    return;
  }

  const q = new URLSearchParams(location.search);
  state.sport = sports.some(s => s.key === q.get('sport')) ? q.get('sport') : sports[0].key;
  const sport = currentSport();
  const wanted = sport.divisions.find(d => d.id === q.get('division'));
  const mine = sport.divisions.find(d => d.rows.some(r => r.is_farmington));
  state.division = (wanted || mine || sport.divisions[0]).id;

  renderPills();
  renderTable();
}).catch(err => {
  console.error('Tigers standings failed to load:', err);
  document.getElementById('standBody').innerHTML =
    '<div class="ft-card"><div class="ft-empty">Standings could not be loaded just now. ' +
    'Please refresh in a moment.</div></div>';
});
</script>
</body>
</html>
