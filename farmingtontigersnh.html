<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Farmington Tigers | FarmingtonTigersNH.com</title>
<meta name="description" content="Schedules, scores, standings and rosters for Farmington High School Tigers athletics.">
<meta property="og:title" content="Farmington Tigers Athletics">
<meta property="og:description" content="Schedules, scores, standings and rosters for the Farmington Tigers.">
<meta property="og:image" content="https://ball603.com/logos/400px/Farmington.png">
<link rel="icon" href="/logos/100px/Farmington.png">
<link rel="apple-touch-icon" href="/logos/200px/Farmington.png">
<link rel="stylesheet" href="/farmington.css">
</head>
<body>

<div id="ft-header"></div>

<main class="ft-wrap">
  <div class="ft-home">

    <section>
      <div class="ft-card">
        <div class="ft-card-head">
          <h2>Tiger <span class="ft-accent">News</span></h2>
          <a class="ft-more" href="/farmingtontigersnh/news">All news &rarr;</a>
        </div>
        <div class="ft-card-body" id="newsBody">
          <div class="ft-placeholder">
            Tigers news lives on Facebook for now.<br>
            <a href="https://www.facebook.com/FarmingtonTigersNH/" target="_blank" rel="noopener">
              Follow the Tigers on Facebook &rarr;</a>
          </div>
        </div>
      </div>
    </section>

    <aside>
      <div class="ft-card">
        <div class="ft-card-head">
          <h2>Recent <span class="ft-accent">Results</span></h2>
          <a class="ft-more" href="/farmingtontigersnh/schedule">Full schedule &rarr;</a>
        </div>
        <div class="ft-card-body flush" id="recentBody">
          <div class="ft-loading">Loading results&hellip;</div>
        </div>
      </div>

      <div class="ft-card">
        <div class="ft-card-head">
          <h2>Upcoming <span class="ft-accent">Events</span></h2>
          <a class="ft-more" href="/farmingtontigersnh/schedule">Full schedule &rarr;</a>
        </div>
        <div class="ft-card-body flush" id="upcomingBody">
          <div class="ft-loading">Loading schedule&hellip;</div>
        </div>
      </div>

      <div class="ft-card">
        <div class="ft-card-head">
          <h2>Varsity <span class="ft-accent">Standings</span></h2>
          <a class="ft-more" id="standMore" href="/farmingtontigersnh/standings">Full standings &rarr;</a>
        </div>
        <div class="ft-card-body ft-pillrow ft-center" id="standChips"></div>
        <div id="standBody"><div class="ft-loading">Loading standings&hellip;</div></div>
      </div>
    </aside>

  </div>
</main>

<div id="ft-footer"></div>

<script src="/farmington.js"></script>
<script>
'use strict';

FT.renderHeader('home');
FT.renderFooter();

let DATA = null;
let standKey = null;

/* ── Recent Results and Upcoming Events ────────────────────────────────── */
/* A calendar week was the wrong unit: a Tuesday visitor in a week whose games
   are all on Saturday saw an empty box, and on Sunday the week rolled over and
   took Saturday's results with it. These two read off the schedule instead —
   the last day the Tigers actually played, and the next day they play — so
   there is always something in both boxes, whatever day somebody arrives.

   Both work off DATA.games, which FT.load() has already sorted by start time. */

const dayCard = (id, day, list, empty) => {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = day
    ? `<div class="ft-week-day${day === FT.todayKey() ? ' today' : ''}">
         <h4>${FT.esc(FT.dayLabel(day))}</h4>
         ${list.map(weekRow).join('')}
       </div>`
    : `<div class="ft-empty">${empty}</div>`;
};

// The most recent day that produced a result. Everything else that day comes
// with it — a postponed game alongside two finals is part of the same day, and
// dropping it would make the box disagree with the schedule page.
function renderRecent() {
  const today = FT.todayKey();
  const played = DATA.games.filter(g => g.game_date <= today && FT.scoreOf(g));
  const day = played.length ? played[played.length - 1].game_date : null;
  dayCard('recentBody', day,
    day ? DATA.games.filter(g => g.game_date === day) : [],
    'No Tigers results yet this season.');
}

// The next day with something still to play. Today counts while any of today's
// games are unfinished, so the box does not skip ahead at breakfast on a day
// the Tigers are playing that night.
function renderUpcoming() {
  const today = FT.todayKey();
  const next = DATA.games.find(g => g.game_date >= today && !FT.scoreOf(g));
  const day = next ? next.game_date : null;
  dayCard('upcomingBody', day,
    day ? DATA.games.filter(g => g.game_date === day && !FT.scoreOf(g)) : [],
    'Nothing on the schedule right now.');
}

function weekRow(g) {
  const sc = FT.scoreOf(g);
  const res = FT.resultOf(sc);
  const opp = FT.versus(g);
  const right = sc
    ? `<span class="ft-result"><span class="${res}">${res}</span> ${sc.us}–${sc.them}</span>`
    : `<span class="ft-week-time">${FT.esc(FT.timeLabel(g.starts_at))}</span>`;

  return `
    <div class="ft-week-game">
      <span class="ft-sport-emoji">${g.sport.emoji}</span>
      <span class="ft-week-opp">
        ${FT.esc(opp)}
        <span class="ft-week-team">${FT.esc(g.team.name)}</span>
      </span>
      ${right}
    </div>`;
}

/* ── Standings box ─────────────────────────────────────────────────────── */
/* Only the varsity sports Farmington is currently playing, which we get for
   free: the NHIAA rankings widget only publishes sports that are in season, so
   whatever landed in farmington_standings is by definition in season. */

function standingsGroups() {
  // Keyed on the division, not Arbiter's group id: one group can publish
  // several divisions, and two groups can publish the same one.
  const groups = new Map();
  for (const row of DATA.standings) {
    const id = `${row.sport_id}|${row.gender_id}|${row.division_name || row.group_name || ''}`;
    if (!groups.has(id)) {
      const sport = FT.SPORTS[row.sport_id];
      groups.set(id, {
        id,
        sportId: row.sport_id,
        genderId: row.gender_id,
        name: sport ? sport.name : row.group_name,
        emoji: sport ? sport.emoji : '\u{1F3C6}',
        division: row.division_name,
        order: sport ? sport.order : 99,
        rows: []
      });
    }
    groups.get(id).rows.push(row);
  }
  for (const g of groups.values()) {
    // Same de-duplication as the standings page: two Arbiter groups can carry
    // the same bracket, so a school is listed once whatever the table holds.
    const seen = new Set();
    g.rows = g.rows
      .sort((a, b) => a.rankings_group_id - b.rankings_group_id)
      .filter(r => !seen.has(r.unique_team_id) && seen.add(r.unique_team_id))
      .sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99));
  }

  // The standings table holds every division of every sport Farmington plays,
  // so the full page can offer division pills. This box is a glance at where
  // the Tigers stand, so it keeps only the divisions they are actually in.
  const out = [...groups.values()]
    .filter(g => g.rows.some(r => r.is_farmington))
    .sort((a, b) => a.order - b.order);

  const perSport = new Map();
  for (const g of out) perSport.set(g.sportId, (perSport.get(g.sportId) || 0) + 1);
  for (const g of out) {
    g.label = perSport.get(g.sportId) > 1
      ? `${FT.genderPrefix(g.genderId, g.sportId)} ${g.name}`.trim()
      : g.name;
  }
  return out;
}

/* A glance, not the whole bracket. Ten rows fill the box; the eleventh starts
   a scroll nobody asked for. But a top ten Farmington is not in is a standings
   box that never mentions Farmington, so once they fall outside it the tenth
   row is given up to them. The rank numbers jump — 9 then 14 — which is the
   honest way to show a gap without inventing a row to hold it. */
const TOP_N = 10;
function topRows(rows) {
  if (rows.length <= TOP_N) return rows;
  const i = rows.findIndex(r => r.is_farmington);
  if (i < 0 || i < TOP_N) return rows.slice(0, TOP_N);
  return rows.slice(0, TOP_N - 1).concat(rows[i]);
}

function renderStandings() {
  const groups = standingsGroups();
  const chipEl = document.getElementById('standChips');
  const body = document.getElementById('standBody');

  if (!groups.length) {
    chipEl.style.display = 'none';
    body.innerHTML = '<div class="ft-empty">No varsity standings posted right now.</div>';
    return;
  }
  if (!groups.some(g => g.id === standKey)) standKey = groups[0].id;

  // The same segmented control the standings page and the schedule use, rather
  // than a row of orange capsules of its own. One pill language across the site
  // means this box cannot drift away from the page it links to.
  chipEl.innerHTML = FT.pills(
    groups.map(g => ({ value: g.id, label: g.label, emoji: g.emoji })), standKey, 'data-group');

  const group = groups.find(g => g.id === standKey);

  // "Full standings" used to be a bare link to the standings page, which opens
  // on its own first sport — so whatever you were looking at here, you landed
  // on volleyball. It carries the sport and division now, and the standings
  // page already reads both off the query string.
  const more = document.getElementById('standMore');
  if (more) {
    more.href = '/farmingtontigersnh/standings?' + new URLSearchParams({
      sport: `${group.sportId}|${group.genderId}`,
      division: group.id
    });
  }

  body.innerHTML = `
    <table class="ft-table">
      <thead><tr>
        <th class="num">#</th><th class="grow">${FT.esc(FT.divisionLabel(group.division) || 'Team')}</th>
        <th class="ctr">W</th><th class="ctr">L</th>
      </tr></thead>
      <tbody>${topRows(group.rows).map(r => `
        <tr class="${r.is_farmington ? 'ft-us' : ''}">
          <td class="num">${r.rank ?? ''}</td>
          <td class="grow">${teamCell(r, group)}</td>
          <td class="ctr">${r.wins ?? 0}</td>
          <td class="ctr">${r.losses ?? 0}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

// Arbiter's own school logo where it has one, and a Ball603 link only where
// Ball603 covers that sport.
function teamCell(row, group) {
  const sportId = row.sport_id;
  const label = row.ball603_shortname || row.team_name;
  const logo = FT.schoolLogo(row);
  const img = logo
    ? `<img src="${FT.esc(logo)}" alt="" onerror="this.remove()">`
    : '';
  return `<span class="ft-logo-cell">${img}${FT.teamLink(row.ball603_shortname, sportId, label)}</span>`;
}

document.getElementById('standChips').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  standKey = btn.dataset.group;
  renderStandings();
});

/* ── Boot ──────────────────────────────────────────────────────────────── */

FT.load().then(data => {
  DATA = data;
  renderRecent();
  renderUpcoming();
  renderStandings();
}).catch(err => {
  console.error('Tigers home page failed to load:', err);
  const oops = '<div class="ft-empty">Could not be loaded. Please refresh in a moment.</div>';
  document.getElementById('recentBody').innerHTML = oops;
  document.getElementById('upcomingBody').innerHTML = oops;
  document.getElementById('standBody').innerHTML =
    '<div class="ft-empty">Standings unavailable.</div>';
});
</script>
</body>
</html>
