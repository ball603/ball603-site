<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Farmington Tigers | FarmingtonTigersNH.com</title>
<meta name="description" content="Schedules, scores, standings and rosters for Farmington High School Tigers athletics.">
<meta property="og:title" content="Farmington Tigers Athletics">
<meta property="og:description" content="Schedules, scores, standings and rosters for the Farmington Tigers.">
<meta property="og:image" content="https://ball603.com/logos/400px/Farmington.png">
<link rel="icon" href="/logos/100px/Farmington.png">
<link rel="apple-touch-icon" href="/logos/200px/Farmington.png">
<link rel="stylesheet" href="/farmington.css?v=3">
</head>
<body>

<div id="ft-header"></div>

<main class="ft-wrap">
  <div class="ft-home">

    <section>
      <div class="ft-card">
        <div class="ft-card-head">
          <h2>Tiger <span class="ft-accent">News</span></h2>
          <a class="ft-more" href="/farmingtontigersnh/news">All news &rarr;</a>
        </div>
        <div class="ft-card-body" id="newsBody">
          <div class="ft-placeholder">
            Tigers news lives on Facebook for now.<br>
            <a href="https://www.facebook.com/FarmingtonTigersNH/" target="_blank" rel="noopener">
              Follow the Tigers on Facebook &rarr;</a>
          </div>
        </div>
      </div>
    </section>

    <aside>
      <div class="ft-card">
        <div class="ft-card-head">
          <h2>This Week in <span class="ft-accent">Tiger Town</span></h2>
          <a class="ft-more" href="/farmingtontigersnh/schedule">Full schedule &rarr;</a>
        </div>
        <div class="ft-card-body flush" id="weekBody">
          <div class="ft-loading">Loading this week&hellip;</div>
        </div>
      </div>

      <div class="ft-card">
        <div class="ft-card-head">
          <h2>Varsity <span class="ft-accent">Standings</span></h2>
          <a class="ft-more" href="/farmingtontigersnh/standings">Full standings &rarr;</a>
        </div>
        <div class="ft-card-body" id="standChips"></div>
        <div id="standBody"><div class="ft-loading">Loading standings&hellip;</div></div>
      </div>
    </aside>

  </div>
</main>

<div id="ft-footer"></div>

<script src="/farmington.js?v=3"></script>
<script>
'use strict';

FT.renderHeader('home');
FT.renderFooter();

let DATA = null;
let standKey = null;

/* ── This Week in Tiger Town ───────────────────────────────────────────── */
/* Sunday through Saturday of the week the visitor is in. It rolls over by
   itself at Sunday midnight — nothing scheduled, nothing to go stale. */

function renderWeek() {
  const el = document.getElementById('weekBody');
  const { from, to, start } = FT.weekWindow();
  const games = DATA.games.filter(g => g.game_date >= from && g.game_date <= to);

  if (!games.length) {
    el.innerHTML = '<div class="ft-empty">No Tigers games scheduled this week.</div>';
    return;
  }

  const byDay = new Map();
  for (const g of games) {
    if (!byDay.has(g.game_date)) byDay.set(g.game_date, []);
    byDay.get(g.game_date).push(g);
  }

  const today = FT.todayKey();
  const out = [];
  for (const [day, list] of byDay) {
    out.push(`
      <div class="ft-week-day${day === today ? ' today' : ''}">
        <h4>${FT.esc(FT.dayLabel(day))}</h4>
        ${list.map(weekRow).join('')}
      </div>`);
  }
  el.innerHTML = out.join('');
}

function weekRow(g) {
  const sc = FT.scoreOf(g);
  const res = FT.resultOf(sc);
  const opp = FT.versus(g);
  const right = sc
    ? `<span class="ft-result"><span class="${res}">${res}</span> ${sc.us}–${sc.them}</span>`
    : `<span class="ft-week-time">${FT.esc(FT.timeLabel(g.starts_at))}</span>`;

  return `
    <div class="ft-week-game">
      <span class="ft-sport-emoji">${g.sport.emoji}</span>
      <span class="ft-week-opp">
        ${FT.esc(opp)}
        <span class="ft-week-team">${FT.esc(g.team.name)}</span>
      </span>
      ${right}
    </div>`;
}

/* ── Standings box ─────────────────────────────────────────────────────── */
/* Only the varsity sports Farmington is currently playing, which we get for
   free: the NHIAA rankings widget only publishes sports that are in season, so
   whatever landed in farmington_standings is by definition in season. */

function standingsGroups() {
  const groups = new Map();
  for (const row of DATA.standings) {
    if (!groups.has(row.rankings_group_id)) {
      const sport = FT.SPORTS[row.sport_id];
      groups.set(row.rankings_group_id, {
        id: row.rankings_group_id,
        label: `${FT.genderLabel(row.gender_id, row.sport_id)} ${sport ? sport.name : row.group_name}`.trim(),
        emoji: sport ? sport.emoji : '\u{1F3C6}',
        division: row.division_name,
        order: sport ? sport.order : 99,
        rows: []
      });
    }
    groups.get(row.rankings_group_id).rows.push(row);
  }
  for (const g of groups.values()) g.rows.sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99));
  return [...groups.values()].sort((a, b) => a.order - b.order);
}

function renderStandings() {
  const groups = standingsGroups();
  const chipEl = document.getElementById('standChips');
  const body = document.getElementById('standBody');

  if (!groups.length) {
    chipEl.style.display = 'none';
    body.innerHTML = '<div class="ft-empty">No varsity standings posted right now.</div>';
    return;
  }
  if (!groups.some(g => g.id === standKey)) standKey = groups[0].id;

  chipEl.innerHTML = `<div class="ft-controls" style="margin:0">` + groups.map(g =>
    `<button class="ft-chip ft-chip-sm${g.id === standKey ? ' on' : ''}" data-group="${g.id}">
       <span>${g.emoji}</span>${FT.esc(g.label)}</button>`).join('') + `</div>`;

  const group = groups.find(g => g.id === standKey);
  body.innerHTML = `
    <table class="ft-table">
      <thead><tr>
        <th class="num">#</th><th class="grow">${FT.esc(group.division || 'Team')}</th>
        <th class="ctr">W</th><th class="ctr">L</th>
      </tr></thead>
      <tbody>${group.rows.map(r => `
        <tr class="${r.is_farmington ? 'ft-us' : ''}">
          <td class="num">${r.rank ?? ''}</td>
          <td class="grow">${teamCell(r, group)}</td>
          <td class="ctr">${r.wins ?? 0}</td>
          <td class="ctr">${r.losses ?? 0}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

// Arbiter's own school logo where it has one, and a Ball603 link only where
// Ball603 covers that sport.
function teamCell(row, group) {
  const sportId = row.sport_id;
  const label = row.ball603_shortname || row.team_name;
  const img = row.school_logo_url
    ? `<img src="${FT.esc(row.school_logo_url)}" alt="" onerror="this.remove()">`
    : '';
  return `<span class="ft-logo-cell">${img}${FT.teamLink(row.ball603_shortname, sportId, label)}</span>`;
}

document.getElementById('standChips').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-chip');
  if (!btn) return;
  standKey = Number(btn.dataset.group);
  renderStandings();
});

/* ── Boot ──────────────────────────────────────────────────────────────── */

FT.load().then(data => {
  DATA = data;
  renderWeek();
  renderStandings();
}).catch(err => {
  console.error('Tigers home page failed to load:', err);
  document.getElementById('weekBody').innerHTML =
    '<div class="ft-empty">This week&rsquo;s games could not be loaded. Please refresh in a moment.</div>';
  document.getElementById('standBody').innerHTML =
    '<div class="ft-empty">Standings unavailable.</div>';
});
</script>
</body>
</html>
