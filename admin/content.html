<!doctype html>
<html lang="en">
<head>
<title>Games &amp; video · NEC Front Row CMS</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/cms.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="assets/cms.js"></script>
</head>
<body>
<header id="top"></header>
<main>
  <h1>Games &amp; video</h1>
  <p class="sub" id="who"></p>

  <div class="filters">
    <input type="search" id="q" placeholder="Search titles…" autocomplete="off">
    <select id="fsport"><option value="">All sports</option></select>
    <select id="fschool"><option value="">All schools</option></select>
    <select id="fstatus">
      <option value="">Any status</option>
      <option value="scheduled">Scheduled</option>
      <option value="live">Live</option>
      <option value="archived">Archived</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <select id="fvis">
      <option value="">Shown &amp; hidden</option>
      <option value="true">Shown only</option>
      <option value="false">Hidden only</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="wrap"><p class="empty">Loading…</p></div>

  <div class="pager" id="pager" hidden>
    <button class="btn" id="prev">← Newer</button>
    <button class="btn" id="nxt">Older →</button>
    <span id="range"></span>
  </div>
</main>
<script>
(async () => {
  const L = CMS_LIB, { db, esc } = L;
  const $ = id => document.getElementById(id);
  const who = await L.guard(); if (!who) return;
  L.header('content');
  const look = await L.lookups();
  $('who').textContent = L.isStaff()
    ? 'Everything the conference carries. Click a row to edit it.'
    : 'Read-only for your account. Use Sections to feature a game on your page.';

  look.sports.forEach(s => $('fsport').add(new Option(s.name, s.key)));
  look.schools.filter(s => s.member !== 'opponent')
    .forEach(s => $('fschool').add(new Option(s.name, s.key)));

  const PER = 50;
  let page = 0;

  // Filters live in the address bar, so a row you clicked into comes back to the
  // same list instead of dumping you at the top.
  const qs = new URLSearchParams(location.search);
  ['q','fsport','fschool','fstatus','fvis'].forEach(k => { if (qs.get(k)) $(k).value = qs.get(k); });
  page = Math.max(0, parseInt(qs.get('p') || '0', 10));

  function saveUrl(){
    const p = new URLSearchParams();
    ['q','fsport','fschool','fstatus','fvis'].forEach(k => { if ($(k).value) p.set(k, $(k).value); });
    if (page) p.set('p', page);
    history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
  }

  const team = k => k ? (look.school[k]?.name || k) : '—';

  function rows(list){
    if (!list.length) return '<p class="empty">Nothing matches those filters.</p>';
    return '<table class="tbl"><thead><tr>' +
      '<th>When</th><th>Matchup</th><th class="hide-sm">Sport</th><th>Status</th>' +
      '<th class="mid">Shown</th><th class="mid hide-sm">Video</th>' +
      '<th class="mid hide-sm">Stats</th><th class="hide-sm">Length</th>' +
      '</tr></thead><tbody>' + list.map(r => {
        // Show the raw title underneath only when it says something the matchup
        // doesn't - otherwise every row reads the same thing twice.
        let mt;
        if (r.kind === 'game' && r.home && r.away) {
          const built = team(r.away) + ' at ' + team(r.home);
          mt = esc(built) + (r.title && r.title.trim() !== built ? '<small>' + esc(r.title) + '</small>' : '');
        } else if (r.kind === 'game') {
          // One side missing means the importer couldn't place a team. Fall back to
          // the title rather than printing a dash, and say so.
          mt = esc(r.title || '(untitled)') + '<small style="color:var(--gold)">needs a team set</small>';
        } else {
          mt = esc(r.title || '(untitled)') + '<small>' + esc(r.kind) + '</small>';
        }
        return '<tr data-id="' + r.id + '">' +
          '<td class="when">' + L.when(r.starts_at) + '<br><span style="color:var(--dim)">' + L.clock(r.starts_at) + '</span></td>' +
          '<td class="match">' + mt + '</td>' +
          '<td class="hide-sm">' + esc(look.sport[r.sport]?.name || '') + '</td>' +
          '<td>' + L.statusPill(r.status) + '</td>' +
          '<td class="mid"><span class="pill ' + (r.visible ? 'on">Shown' : 'off">Hidden') + '</span></td>' +
          '<td class="mid hide-sm ' + (r.stream_url ? 'has">✓' : 'hasnt">—') + '</td>' +
          '<td class="mid hide-sm ' + (r.stats_url ? 'has">✓' : 'hasnt">—') + '</td>' +
          '<td class="hide-sm" style="color:var(--muted)">' + L.secs(r.duration_seconds) + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>';
  }

  async function load(){
    $('wrap').innerHTML = '<p class="empty">Loading…</p>';
    let qy = db.from('content')
      .select('id,kind,title,starts_at,sport,home,away,status,visible,stream_url,stats_url,duration_seconds',
              { count: 'exact' })
      .order('starts_at', { ascending: false, nullsFirst: false })
      .range(page * PER, page * PER + PER - 1);

    const q = $('q').value.trim();
    if (q)               qy = qy.ilike('title', '%' + q + '%');
    if ($('fsport').value)  qy = qy.eq('sport',  $('fsport').value);
    if ($('fstatus').value) qy = qy.eq('status', $('fstatus').value);
    if ($('fvis').value)    qy = qy.eq('visible', $('fvis').value === 'true');
    const sch = $('fschool').value;
    if (sch)             qy = qy.or('home.eq.' + sch + ',away.eq.' + sch);

    const { data, error, count } = await qy;
    if (error) {
      $('wrap').innerHTML = '<p class="note bad"><b>Could not load.</b> ' + esc(error.message) + '</p>';
      return;
    }
    $('wrap').innerHTML = rows(data || []);
    $('count').textContent = (count ?? 0).toLocaleString() + ' item' + (count === 1 ? '' : 's');
    const from = count ? page * PER + 1 : 0, to = Math.min((page + 1) * PER, count ?? 0);
    $('range').textContent = count ? from.toLocaleString() + '–' + to.toLocaleString() + ' of ' + count.toLocaleString() : '';
    $('pager').hidden = (count ?? 0) <= PER;
    $('prev').disabled = page === 0;
    $('nxt').disabled  = to >= (count ?? 0);
    if (L.isStaff()) {
      $('wrap').querySelectorAll('tr[data-id]').forEach(tr => {
        tr.onclick = () => { location.href = 'game.html?id=' + tr.dataset.id + '&back=' + encodeURIComponent(location.search); };
      });
    } else {
      $('wrap').querySelectorAll('tbody tr').forEach(tr => tr.style.cursor = 'default');
    }
    saveUrl();
  }

  // Typing shouldn't fire a query per keystroke.
  let t;
  $('q').oninput = () => { clearTimeout(t); t = setTimeout(() => { page = 0; load(); }, 280); };
  ['fsport','fschool','fstatus','fvis'].forEach(k => $(k).onchange = () => { page = 0; load(); });
  $('prev').onclick = () => { if (page > 0) { page--; load(); window.scrollTo(0,0); } };
  $('nxt').onclick  = () => { page++; load(); window.scrollTo(0,0); };
  load();
})();
</script>
</body>
</html>
