<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball603 Reconcile — Orphaned Articles</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1a1a;
      --bg-card: #242424;
      --bg-card-hover: #2a2a2a;
      --bg-row: #2d2d2d;
      --border: #333;
      --border-light: #444;
      --text: #fff;
      --text-dim: #aaa;
      --text-muted: #666;
      --accent: #f57c00;
      --accent-bright: #ffa040;
      --good: #4caf50;
      --warn: #ffc107;
      --bad: #ef5350;
      --info: #5a9ee0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Login Screen */
    .login-screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      z-index: 1000;
    }
    .login-box {
      background: var(--bg-card);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .login-box img { height: 36px; margin-bottom: 12px; }
    .login-box h2 { font-size: 24px; margin-bottom: 4px; }
    .login-box p { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
    .login-box input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 15px;
      margin-bottom: 12px;
    }
    .login-box input:focus { outline: none; border-color: var(--accent); }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .login-box button:hover { background: var(--accent-bright); }
    .login-error { color: var(--bad); font-size: 13px; margin-bottom: 12px; }

    /* Main */
    .page-header {
      background: var(--bg-card);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .page-header-left { display: flex; align-items: center; gap: 12px; }
    .page-header img { height: 28px; cursor: pointer; }
    .page-header h1 { font-size: 18px; font-weight: 800; }
    .page-header .subtitle { color: var(--text-dim); font-size: 13px; margin-left: 8px; }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-logout:hover { color: var(--text); border-color: var(--text-dim); }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .toolbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .stat-pill strong { color: var(--text); font-weight: 800; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: var(--accent-bright); }
    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-dim);
      border: 1px solid var(--border-light);
    }
    .btn-secondary:hover { color: var(--text); }

    .loading, .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
    }

    .orphan-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .orphan-card.applied {
      opacity: 0.6;
      border-color: var(--good);
    }
    .orphan-card.applied::before {
      content: '✓ Applied';
      display: block;
      background: var(--good);
      color: #000;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
    }

    .orphan-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .orphan-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .orphan-meta {
      display: flex; flex-wrap: wrap; gap: 14px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .orphan-meta .label { color: var(--text-muted); margin-right: 4px; }
    .orphan-id {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--accent-bright);
      background: rgba(245,124,0,0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .orphan-parsed {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .candidates {
      padding: 12px 20px 16px;
    }
    .candidates-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .candidate {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: var(--bg-row);
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }
    .candidate:hover { border-color: var(--border-light); }
    .candidate.selected { border-color: var(--accent); background: rgba(245,124,0,0.08); }
    .candidate input[type=radio] { accent-color: var(--accent); }
    .candidate-body { flex: 1; min-width: 0; }
    .candidate-line1 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .candidate-line2 {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .candidate-score {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .score-high { background: var(--good); color: #000; }
    .score-mid { background: var(--warn); color: #000; }
    .score-low { background: var(--border-light); color: var(--text-dim); }
    .candidate-date-off {
      font-size: 10px;
      color: var(--info);
      margin-left: 6px;
    }

    .custom-input {
      display: flex; gap: 8px;
      margin-top: 8px;
    }
    .custom-input input {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .custom-input input:focus { outline: none; border-color: var(--accent); }

    .orphan-actions {
      padding: 12px 20px;
      background: rgba(0,0,0,0.2);
      display: flex; gap: 10px; align-items: center;
      border-top: 1px solid var(--border);
    }
    .orphan-result {
      font-size: 12px;
      flex: 1;
      color: var(--text-dim);
    }
    .orphan-result.success { color: var(--good); }
    .orphan-result.error { color: var(--bad); }

    .no-candidates {
      padding: 12px;
      background: var(--bg-row);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      font-style: italic;
    }

    @media (max-width: 640px) {
      .container { padding: 14px; }
      .orphan-meta { gap: 8px; }
      .candidate-line2 { display: none; }
    }
  </style>
</head>
<body>
  <!-- Login -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <img src="/logo.png" alt="Ball603">
      <h2>Ball603 Reconcile</h2>
      <p>Repair orphaned article links</p>
      <div class="login-error" id="loginError" style="display: none;"></div>
      <input type="password" id="loginPassword" placeholder="Enter password" onkeypress="if(event.key==='Enter')login()">
      <button onclick="login()">Sign In</button>
    </div>
  </div>

  <!-- Main -->
  <div id="mainApp" style="display: none;">
    <div class="page-header">
      <div class="page-header-left">
        <img src="/logo.png" alt="Ball603" onclick="window.location.href='/admin'">
        <h1>Reconcile</h1>
        <span class="subtitle">Orphaned Articles</span>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="container">
      <div class="toolbar">
        <span class="stat-pill"><strong id="orphanCount">…</strong> orphans</span>
        <span class="stat-pill"><strong id="appliedCount">0</strong> applied</span>
        <button class="btn" onclick="loadAudit()">↻ Refresh</button>
      </div>

      <div id="orphanList">
        <div class="loading">Loading audit…</div>
      </div>
    </div>
  </div>

  <script>
    const CMS_PASSWORD = 'Gr@niteSt@teHoops';

    // ---- AUTH ----
    function login() {
      const pw = document.getElementById('loginPassword').value;
      if (pw === CMS_PASSWORD) {
        sessionStorage.setItem('cms_auth', 'true');
        showApp();
      } else {
        const err = document.getElementById('loginError');
        err.textContent = 'Incorrect password';
        err.style.display = 'block';
      }
    }
    function logout() {
      sessionStorage.removeItem('cms_auth');
      location.reload();
    }
    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      loadAudit();
    }
    if (sessionStorage.getItem('cms_auth') === 'true') {
      showApp();
    }

    // ---- STATE ----
    let appliedCount = 0;

    function setApplied(orphanCardEl, message, isError = false) {
      if (!isError) {
        orphanCardEl.classList.add('applied');
        appliedCount++;
        document.getElementById('appliedCount').textContent = appliedCount;
      }
      const resultEl = orphanCardEl.querySelector('.orphan-result');
      if (resultEl) {
        resultEl.textContent = message;
        resultEl.className = 'orphan-result ' + (isError ? 'error' : 'success');
      }
    }

    // ---- AUDIT ----
    async function loadAudit() {
      const list = document.getElementById('orphanList');
      list.innerHTML = '<div class="loading">Loading audit…</div>';
      appliedCount = 0;
      document.getElementById('appliedCount').textContent = '0';

      try {
        const resp = await fetch('/.netlify/functions/reconcile-audit');
        if (!resp.ok) throw new Error(`Audit failed: ${resp.status} ${await resp.text()}`);
        const data = await resp.json();
        if (!data.success) throw new Error(data.error || 'Audit returned no success');

        document.getElementById('orphanCount').textContent = data.orphanCount;

        if (data.orphanCount === 0) {
          list.innerHTML = '<div class="empty">✓ No orphaned articles. Everything is in sync.</div>';
          return;
        }

        list.innerHTML = '';
        for (const orphan of data.orphans) {
          list.appendChild(renderOrphan(orphan));
        }
      } catch (err) {
        list.innerHTML = `<div class="empty">Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderOrphan(o) {
      const card = document.createElement('div');
      card.className = 'orphan-card';
      card.dataset.articleId = o.article.id;
      card.dataset.currentGameId = o.currentGameId;

      const head = document.createElement('div');
      head.className = 'orphan-head';
      head.innerHTML = `
        <div class="orphan-title">${escapeHtml(o.article.title || '(no title)')}</div>
        <div class="orphan-meta">
          <span><span class="label">Status:</span>${escapeHtml(o.article.status || '—')}</span>
          <span><span class="label">Created:</span>${formatDate(o.article.created_at)}</span>
          ${o.article.slug ? `<span><span class="label">Slug:</span><a href="/article/${escapeHtml(o.article.slug)}" target="_blank" style="color: var(--accent-bright); text-decoration: none;">/${escapeHtml(o.article.slug)}</a></span>` : ''}
        </div>
        <div class="orphan-parsed">
          <span class="label">Orphaned game_id:</span>
          <span class="orphan-id">${escapeHtml(o.currentGameId)}</span>
          ${o.parsed?.type === 'nhiaa' ? `
            <span style="margin-left: 10px; color: var(--text-muted);">
              Parsed: ${o.parsed.gender}, ${o.parsed.dateIso}${o.parsed.suffix ? ', ' + o.parsed.suffix : ''}
            </span>
          ` : o.parsed?.type === 'manual' ? `
            <span style="margin-left: 10px; color: var(--text-muted);">Manual ID — no date parseable from ID</span>
          ` : `
            <span style="margin-left: 10px; color: var(--text-muted);">Unparseable ID format</span>
          `}
        </div>
      `;

      const candidatesEl = document.createElement('div');
      candidatesEl.className = 'candidates';
      candidatesEl.innerHTML = `<div class="candidates-header">Choose target game</div>`;

      const radioName = `target-${o.article.id}`;

      // Render top candidates
      if (o.candidates.length === 0) {
        candidatesEl.insertAdjacentHTML('beforeend', `
          <div class="no-candidates">No candidate games found on parsed date/gender. Use Custom or NULL.</div>
        `);
      } else {
        o.candidates.forEach((c, idx) => {
          const scoreClass = c.score >= 70 ? 'score-high' : c.score >= 30 ? 'score-mid' : 'score-low';
          const dateOffsetText = (c.dateOffset && c.dateOffset !== 0)
            ? `<span class="candidate-date-off">${c.dateOffset > 0 ? '+' : ''}${c.dateOffset}d</span>`
            : '';
          const item = document.createElement('label');
          item.className = 'candidate' + (idx === 0 ? ' selected' : '');
          item.innerHTML = `
            <input type="radio" name="${radioName}" value="${escapeHtml(c.game_id)}" ${idx === 0 ? 'checked' : ''}>
            <div class="candidate-body">
              <div class="candidate-line1">
                ${escapeHtml(c.away_team)} @ ${escapeHtml(c.home_team)}
                ${(c.home_score !== null && c.away_score !== null) ? ` <span style="color: var(--text-dim); font-weight: 500;">(${c.away_score}–${c.home_score})</span>` : ''}
                — ${escapeHtml(c.date)}, ${escapeHtml(c.gender || '?')} ${escapeHtml(c.division || '')}
                ${dateOffsetText}
              </div>
              <div class="candidate-line2">${escapeHtml(c.game_id)}</div>
            </div>
            <span class="candidate-score ${scoreClass}">${c.score}</span>
          `;
          item.addEventListener('click', () => {
            candidatesEl.querySelectorAll('.candidate').forEach(el => el.classList.remove('selected'));
            item.classList.add('selected');
          });
          candidatesEl.appendChild(item);
        });
      }

      // NULL option
      const nullItem = document.createElement('label');
      nullItem.className = 'candidate';
      nullItem.innerHTML = `
        <input type="radio" name="${radioName}" value="__NULL__">
        <div class="candidate-body">
          <div class="candidate-line1" style="color: var(--text-dim); font-style: italic;">Set to NULL (no game link)</div>
          <div class="candidate-line2">Article stays published, just won't be linked to a game</div>
        </div>
      `;
      nullItem.addEventListener('click', () => {
        candidatesEl.querySelectorAll('.candidate').forEach(el => el.classList.remove('selected'));
        nullItem.classList.add('selected');
      });
      candidatesEl.appendChild(nullItem);

      // Custom game_id option
      const customWrap = document.createElement('div');
      customWrap.className = 'custom-input';
      customWrap.innerHTML = `
        <input type="text" placeholder="…or paste a specific game_id (will be verified to exist)" id="custom-${o.article.id}">
      `;
      candidatesEl.appendChild(customWrap);

      const actions = document.createElement('div');
      actions.className = 'orphan-actions';
      actions.innerHTML = `
        <div class="orphan-result"></div>
        <button class="btn-secondary btn" onclick="skipOrphan(this)">Skip</button>
        <button class="btn" onclick="applyOrphan(this)">Apply re-link</button>
      `;

      card.appendChild(head);
      card.appendChild(candidatesEl);
      card.appendChild(actions);
      return card;
    }

    async function applyOrphan(btn) {
      const card = btn.closest('.orphan-card');
      const articleId = card.dataset.articleId;
      const currentGameId = card.dataset.currentGameId;

      // Determine target: custom input wins if non-empty, else selected radio
      const customInput = card.querySelector(`#custom-${articleId}`);
      const customVal = customInput ? customInput.value.trim() : '';

      let target;
      if (customVal) {
        target = customVal;
      } else {
        const radio = card.querySelector('input[type=radio]:checked');
        if (!radio) {
          setApplied(card, 'Select a target first', true);
          return;
        }
        target = radio.value === '__NULL__' ? null : radio.value;
      }

      // Confirm
      const before = currentGameId;
      const after = target === null ? '(NULL — no link)' : target;
      const ok = confirm(`Re-link article:\n\n${card.querySelector('.orphan-title').textContent}\n\nFROM: ${before}\nTO:   ${after}\n\nProceed?`);
      if (!ok) return;

      btn.disabled = true;
      btn.textContent = '…';
      setApplied(card, 'Applying…', false);
      card.classList.remove('applied'); // remove until success

      try {
        const resp = await fetch('/.netlify/functions/reconcile-relink', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            articleId,
            expectedCurrentGameId: currentGameId,
            newGameId: target,
          }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.success) {
          throw new Error(data.error || `HTTP ${resp.status}`);
        }
        const afterId = data.after?.game_id;
        const afterStr = afterId === null || afterId === undefined ? '(NULL)' : afterId;
        setApplied(card, `✓ Re-linked → ${afterStr}`, false);
        btn.textContent = 'Done';
      } catch (err) {
        setApplied(card, `Error: ${err.message}`, true);
        btn.disabled = false;
        btn.textContent = 'Apply re-link';
      }
    }

    function skipOrphan(btn) {
      const card = btn.closest('.orphan-card');
      card.style.opacity = '0.4';
      const resultEl = card.querySelector('.orphan-result');
      if (resultEl) {
        resultEl.textContent = 'Skipped';
        resultEl.className = 'orphan-result';
      }
      // Disable inputs/buttons
      card.querySelectorAll('input, button').forEach(el => {
        if (!el.classList.contains('btn-logout')) el.disabled = true;
      });
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function formatDate(s) {
      if (!s) return '—';
      try {
        const d = new Date(s);
        if (isNaN(d.getTime())) return s;
        return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch { return s; }
    }
  </script>
</body>
</html>
