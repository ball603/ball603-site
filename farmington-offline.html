<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline | Farmington Tigers</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="/logos/100px/Farmington.png">
<link rel="stylesheet" href="/farmington.css">
<style>
  .ft-offline{
    min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:14px;padding:30px 20px;
  }
  .ft-offline img{width:110px;height:auto}
  .ft-offline h1{margin:0;font-size:24px}
  .ft-offline p{margin:0;color:var(--ft-ink-2);max-width:32em;line-height:1.55}
</style>
</head>
<body>

<div id="ft-header"></div>

<main class="ft-wrap">
  <div class="ft-offline">
    <img src="/icons/farmington/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Scores and schedules come from the Tigers' live feed, so there's nothing new to show
       until you're back on a network. Anything you've already opened is still here.</p>
    <button class="ft-btn ft-btn-go" type="button" style="width:auto" onclick="location.reload()">Try again</button>
  </div>
</main>

<div id="ft-footer"></div>

<script src="/farmington.js"></script>
<script>
'use strict';
FT.renderHeader('');
FT.renderFooter();

// Come back by itself the moment the network does, rather than leaving somebody
// on a dead end waiting to think of pressing the button.
window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
