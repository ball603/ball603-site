<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEC Front Row Multiview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: broadcast control room — one stage on top, controls under it, the games list below. Dark by design. */
:root{
  --bg:#0b1118;
  --panel:#121a24;
  --line:#22303f;
  --text:#e9eef4;
  --muted:#8b9aab;
  --nec:#1f8fd6;        /* NEC blue */
  --nec-deep:#0a5e9c;
  --live:#e5383b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--nec);outline-offset:2px}

/* Header */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;font-style:italic;color:var(--nec)}
.brand span{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.tag{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.modes{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.modes button{border:0;background:none;padding:8px 16px;border-radius:999px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--nec);color:#fff}

/* Stage */
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden}
.tile{position:absolute;background:#000;overflow:hidden;transition:all .35s ease}
.tile video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.tile[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}

/* Single */
.mode-single .tile.is-focus{inset:0}
/* PiP */
.mode-pip .tile.is-focus{inset:0}
.mode-pip .tile.is-pip{width:32%;aspect-ratio:16/9;height:auto;right:2%;bottom:3%;left:auto;top:auto;border:2px solid var(--nec);border-radius:8px;z-index:3;cursor:grab;touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.rh{position:absolute;width:22px;height:22px;z-index:4;display:none;touch-action:none}
.rh::after{content:"";position:absolute;width:10px;height:10px;border:3px solid var(--nec)}
.mode-pip .tile.is-pip .rh{display:block}
.rh[data-c="nw"]{top:-2px;left:-2px;cursor:nwse-resize}.rh[data-c="nw"]::after{top:2px;left:2px;border-right:0;border-bottom:0}
.rh[data-c="ne"]{top:-2px;right:-2px;cursor:nesw-resize}.rh[data-c="ne"]::after{top:2px;right:2px;border-left:0;border-bottom:0}
.rh[data-c="sw"]{bottom:-2px;left:-2px;cursor:nesw-resize}.rh[data-c="sw"]::after{bottom:2px;left:2px;border-right:0;border-top:0}
.rh[data-c="se"]{bottom:-2px;right:-2px;cursor:nwse-resize}.rh[data-c="se"]::after{bottom:2px;right:2px;border-left:0;border-top:0}
.tk{cursor:pointer}.tk:hover .tm{text-decoration:underline}
.mode-pip .tile.is-pip.dragging{cursor:grabbing;transition:none}
/* Quad */
.mode-quad .tile{width:calc(50% - 2px);height:calc(50% - 2px);cursor:pointer}
.mode-quad .tile[data-slot="0"]{top:0;left:0}
.mode-quad .tile[data-slot="1"]{top:0;right:0}
.mode-quad .tile[data-slot="2"]{bottom:0;left:0}
.mode-quad .tile[data-slot="3"]{bottom:0;right:0}
.mode-quad .tile.is-focus::after{content:"";position:absolute;inset:0;border:3px solid var(--nec);pointer-events:none;z-index:4}

/* Score bug */
.bug{position:absolute;left:3%;bottom:4%;display:flex;align-items:stretch;font-family:var(--display);font-weight:700;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.5);font-size:clamp(11px,1.6vw,18px);line-height:1;pointer-events:none}
.mode-quad .bug{font-size:clamp(9px,1vw,13px)}
.mode-pip .tile.is-pip .bug{display:none}
.bug .t{display:flex;align-items:center;gap:.5em;padding:.45em .6em;color:#fff}
.bug .t i{font-style:normal;font-size:1.15em;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.bug .c{background:#0d0d0d;color:#fff;padding:.45em .7em;display:flex;align-items:center;gap:.5em;font-variant-numeric:tabular-nums}
.bug .c small{color:#bbb;font-size:.8em}
.bug .nec{background:var(--nec);padding:.45em .5em;color:#fff;font-style:italic;font-weight:800}
.bug{display:none}
.flash{animation:flash .9s ease}

/* Bottom line ticker */
.ticker{display:flex;align-items:stretch;background:#05080c;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:44px;margin-top:-8px}
.stage .ticker{position:absolute;left:0;right:0;bottom:0;z-index:5;margin:0;border:0;border-radius:0;border-top:1px solid var(--line)}
.stage.has-ticker .vc{bottom:44px}
.stage.has-ticker .bug{bottom:calc(4% + 44px)}
.ticker .lbl{flex:none;display:flex;align-items:center;gap:6px;background:var(--nec);color:#fff;padding:0 14px;font-family:var(--display);font-weight:800;font-style:italic;font-size:18px;letter-spacing:.03em;z-index:1}
.ticker .lbl small{font-style:normal;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ticker .view{flex:1;min-width:0;overflow:hidden;position:relative}
.ticker .belt{display:flex;width:max-content;height:100%;animation:belt 40s linear infinite}
.ticker:hover .belt{animation-play-state:paused}
.ticker .set{display:flex;height:100%}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .belt{animation:none}.ticker .view{overflow-x:auto}}
.tk{display:flex;align-items:center;gap:10px;padding:0 22px;border-right:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tk .sp{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tk .tm{display:flex;align-items:center;gap:6px}
.tk .sw{width:4px;height:18px;border-radius:2px}
.tk .lead{color:#fff}
.tk .trail{color:var(--muted)}
.tk .st{font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tk .st.live{color:#ffb4b5}
.tk .lp{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.tk.flash .tm{animation:flash .9s ease}
.ticker .wait{display:flex;align-items:center;padding:0 16px;color:var(--muted);font-size:13px}
@keyframes flash{0%{background:#ffd60a;color:#000}100%{}}

.badge{position:absolute;top:3%;left:3%;z-index:2;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.badge .live{background:var(--live);color:#fff;padding:3px 7px;border-radius:3px}
[hidden]{display:none!important}
.badge .snd{display:inline-flex;align-items:center;background:rgba(0,0,0,.7);padding:3px 6px;border-radius:3px;color:#fff}
.mode-pip .tile.is-pip .badge .snd{display:none}
.badge .live{transition:opacity .6s ease}
.tile.live-off .badge .live{opacity:0}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:14px;z-index:1}

.tapsound{position:absolute;top:3%;right:3%;z-index:5;border:0;background:var(--nec);color:#fff;padding:8px 12px;border-radius:6px;font-weight:600;font-size:13px}

/* Controls laid over the video; they show when you move the mouse or tap, then fade */
.vc{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:40px 14px 12px;background:linear-gradient(to top,rgba(4,8,12,.92),rgba(4,8,12,.6) 60%,transparent);opacity:0;pointer-events:none;transition:opacity .3s ease}
.stage.show-ui .vc{opacity:1;pointer-events:auto}
.stage.show-ui{cursor:default}
.stage:not(.show-ui){cursor:none}
.mode-pip .tile.is-pip{cursor:grab}
.vc .now{flex:1 1 200px;min-width:0}
.vc .now b{display:block;font-family:var(--display);font-size:22px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.vc .now span{font-size:13px;color:#b9c4d0}
.vc .btns{display:flex;flex-wrap:wrap;gap:8px}
.ctl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(18,26,36,.85);padding:9px 12px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
.ctl:hover{border-color:var(--nec)}
.ctl.primary{background:var(--nec);border-color:var(--nec);color:#fff}
.ctl svg{width:18px;height:18px;fill:currentColor;flex:none}
@media (max-width:760px){.vc .now{flex-basis:100%}.vc .ctl .tx{display:none}.vc .ctl{padding:9px}.vc{padding-top:30px}}
@media (prefers-reduced-motion:reduce){.vc,.badge .live{transition:none}}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>NEC</b><span>Front Row</span><span class="tag">Multiview demo</span></div>
    <div class="modes" role="group" aria-label="View">
      <button id="m-single" data-mode="single">Single</button>
      <button id="m-pip" data-mode="pip">Picture-in-Picture</button>
      <button id="m-quad" data-mode="quad">Quad</button>
    </div>
  </header>

  <div id="stage" class="stage mode-quad" aria-label="Video stage">
    <div class="vc" id="vc">
      <div class="now"><b id="nowTitle">Loading games…</b><span id="nowSub"></span></div>
      <div class="btns">
        <button class="ctl" id="back10" title="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span class="tx">10s</span></button>
        <button class="ctl" id="play" title="Play or pause"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><span class="tx">Pause</span></button>
        <button class="ctl primary" id="golive" title="Jump to live"><span>Go live</span></button>
        <button class="ctl" id="sound" title="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg><span class="tx">Sound on</span></button>
        <button class="ctl" id="popout" title="Pop the game out over other apps"><svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H3V5h18v14z"/></svg><span class="tx">Pop out</span></button>
        <button class="ctl" id="full" title="Full screen"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg><span class="tx">Full screen</span></button>
        <button class="ctl primary" id="tickerBtn" title="Show or hide the score ticker" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M2 15h20v5H2zM4 17h3v1H4zm5 0h3v1H9zm5 0h3v1h-3z"/></svg><span class="tx">Ticker</span></button>
      </div>
    </div>
  </div>

  <div class="ticker" id="ticker" aria-label="NEC scores">
    <div class="lbl">NEC <small>Scores</small></div>
    <div class="view"><div class="belt" id="belt"><div class="set"><span class="wait">Loading scores…</span></div></div></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(function(){
  const FALLBACK = []; // filled if games.json can't load
  const stage = document.getElementById('stage');
  let games = [], tiles = [], mode = 'quad', focus = 0, pip = 1, soundOn = false, lastMode = null, lastFocus = null;
  const FEED = '/.netlify/functions/nec-stats-feed';

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

  function buildTile(g, i){
    const el = document.createElement('div');
    el.className = 'tile'; el.dataset.slot = i;
    el.innerHTML =
      '<video playsinline muted autoplay></video>' +
      '<div class="badge"><span class="live">Live</span><span class="snd" hidden aria-label="Sound on"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></span></div>' +
      '<span class="rh" data-c="nw"></span><span class="rh" data-c="ne"></span><span class="rh" data-c="sw"></span><span class="rh" data-c="se"></span>' +
      '<div class="bug">' +
        '<span class="nec">NEC</span>' +
        '<span class="t" style="background:'+esc(g.away.color)+'">'+esc(g.away.abbr)+'<i class="sa">'+g.stats.away+'</i></span>' +
        '<span class="t" style="background:'+esc(g.home.color)+'">'+esc(g.home.abbr)+'<i class="sh">'+g.stats.home+'</i></span>' +
        '<span class="c"><span class="clk">'+esc(g.stats.clock)+'</span><small>'+esc(g.stats.period)+'</small></span>' +
      '</div>';
    stage.appendChild(el);
    const video = el.querySelector('video');
    const t = { el, video, hls:null, game:g };
    el.addEventListener('click', () => {
      if (el.dataset.dragged) { delete el.dataset.dragged; return; }   // a drag isn't a tap
      if (mode === 'pip' && i === pip) { [focus, pip] = [pip, focus]; apply(); }
      else if (mode === 'quad') { focus = i; apply(); }
    });
    makeDraggable(el, i);
    liveFlash(t);
    load(t, g.stream);
    return t;
  }

  // Hudl links go through our site's helper, because Hudl blocks the first file for other websites
  function viaHelper(url){
    const m = String(url).match(/^https?:\/\/vcloud\.hudl\.com\/file\/hls\/(\d+)\.m3u8/i);
    return m ? '/.netlify/functions/hudl-playlist?id=' + m[1] : url;
  }

  function load(t, url){
    url = viaHelper(url);
    const v = t.video;
    t.el.querySelector('.err')?.remove();
    if (t.hls) { t.hls.destroy(); t.hls = null; }
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ capLevelToPlayerSize:true, liveDurationInfinity:true, backBufferLength:600 });
      hls.loadSource(url); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { setQuality(t); v.play().catch(()=>{}); });
      hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) showErr(t); });
      t.hls = hls;
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = url; v.play().catch(()=>{});   // iPhone / Safari play these natively
    } else { showErr(t); }
  }

  function showErr(t){
    if (t.el.querySelector('.err')) return;
    const d = document.createElement('div'); d.className = 'err';
    d.textContent = 'This stream could not load. Check the link or try again.';
    t.el.appendChild(d);
  }

  // Main game gets full quality; the others drop to their lowest quality to save internet.
  function setQuality(t){
    if (!t.hls) return;
    const isMain = tiles[focus] === t;
    t.hls.autoLevelCapping = isMain ? -1 : 0;
  }

  function apply(){
    const keepUI = stage.classList.contains('show-ui');
    const keepTk = stage.classList.contains('has-ticker');
    stage.className = 'stage mode-' + mode + (keepUI ? ' show-ui' : '') + (keepTk ? ' has-ticker' : '');
    const changed = mode !== lastMode || focus !== lastFocus; lastMode = mode; lastFocus = focus;
    tiles.forEach((t, i) => {
      t.el.classList.toggle('is-focus', i === focus);
      t.el.classList.toggle('is-pip', mode === 'pip' && i === pip);
      t.el.hidden = (mode === 'single' && i !== focus) || (mode === 'pip' && i !== focus && i !== pip);
      t.video.muted = !(soundOn && i === focus);
      t.el.querySelector('.snd').hidden = !(soundOn && i === focus);
      setQuality(t);
      if (!t.el.hidden) { t.video.play().catch(()=>{}); if (changed) liveFlash(t); }
      else t.video.pause();
    });
    document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
    const g = tiles[focus].game;
    document.getElementById('nowTitle').textContent = g.away.name + ' at ' + g.home.name;
    document.getElementById('nowSub').textContent = g.sport + ' · ' + g.venue;
    document.querySelector('#sound .tx').textContent = soundOn ? 'Sound off' : 'Sound on';
    placePip();
  }

  // Live edge helpers
  function liveEdge(t){
    if (t.hls && t.hls.liveSyncPosition) return t.hls.liveSyncPosition;
    const s = t.video.seekable; return s.length ? s.end(s.length - 1) : t.video.duration;
  }
  setInterval(() => {
    const v = tiles[focus]?.video;
    if (v) document.querySelector('#play .tx').textContent = v.paused ? 'Play' : 'Pause';
  }, 1000);

  // "Live" tag shows for a few seconds, then fades away
  function liveFlash(t){
    t.el.classList.remove('live-off'); clearTimeout(t.liveTimer);
    t.liveTimer = setTimeout(() => t.el.classList.add('live-off'), 4000);
  }

  // Drag the small Picture-in-Picture box anywhere on the video
  let pipPos = null;   // { x, y } as fractions of the stage, once moved
  let pipW = null;     // width as a fraction of the stage, once resized
  function placePip(){
    tiles.forEach((t, i) => {
      const st = t.el.style;
      if (mode === 'pip' && i === pip && pipPos) {
        st.left = (pipPos.x * 100) + '%'; st.top = (pipPos.y * 100) + '%'; st.right = 'auto'; st.bottom = 'auto';
      } else { st.left = st.top = st.right = st.bottom = ''; }
      st.width = (mode === 'pip' && i === pip && pipW) ? (pipW * 100) + '%' : '';
    });
  }
  function makeDraggable(el, i){
    let start = null;
    el.addEventListener('pointerdown', e => {
      if (!(mode === 'pip' && i === pip)) return;
      const sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
      start = { px:e.clientX, py:e.clientY, x:r.left - sr.left, y:r.top - sr.top, moved:false };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!start) return;
      const dx = e.clientX - start.px, dy = e.clientY - start.py;
      if (!start.moved && Math.hypot(dx, dy) < 6) return;
      start.moved = true; el.classList.add('dragging');
      const sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
      const x = Math.min(Math.max(0, start.x + dx), sr.width - r.width);
      const y = Math.min(Math.max(0, start.y + dy), sr.height - r.height);
      pipPos = { x: x / sr.width, y: y / sr.height };
      placePip();
    });
    const end = () => {
      if (!start) return;
      if (start.moved) el.dataset.dragged = '1';
      el.classList.remove('dragging'); start = null;
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);

    // Corners resize the box, keeping it widescreen and pinned at the opposite corner
    el.querySelectorAll('.rh').forEach(h => {
      let rs = null;
      h.addEventListener('pointerdown', e => {
        if (!(mode === 'pip' && i === pip)) return;
        e.stopPropagation(); e.preventDefault();
        const sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
        rs = { px:e.clientX, c:h.dataset.c, l:r.left - sr.left, t:r.top - sr.top, w:r.width, h:r.height };
        h.setPointerCapture(e.pointerId); el.classList.add('dragging');
      });
      h.addEventListener('pointermove', e => {
        if (!rs) return;
        const sr = stage.getBoundingClientRect();
        const dx = e.clientX - rs.px, west = rs.c.includes('w'), north = rs.c.includes('n');
        let w = rs.w + (west ? -dx : dx);
        w = Math.max(sr.width * 0.18, Math.min(sr.width * 0.75, w));
        const hgt = w * 9 / 16;
        let x = west ? rs.l + rs.w - w : rs.l;
        let y = north ? rs.t + rs.h - hgt : rs.t;
        x = Math.max(0, Math.min(x, sr.width - w)); y = Math.max(0, Math.min(y, sr.height - hgt));
        pipW = w / sr.width; pipPos = { x: x / sr.width, y: y / sr.height };
        placePip();
      });
      const done = () => { if (rs) { el.dataset.dragged = '1'; el.classList.remove('dragging'); rs = null; } };
      h.addEventListener('pointerup', done); h.addEventListener('pointercancel', done);
      h.addEventListener('click', e => e.stopPropagation());
    });
  }

  // Video controls appear when you move the mouse or tap, and hide after 3 seconds
  let uiTimer;
  function showUI(){
    stage.classList.add('show-ui'); clearTimeout(uiTimer);
    uiTimer = setTimeout(() => { if (!stage.matches(':hover') || !document.getElementById('vc').matches(':hover')) stage.classList.remove('show-ui'); }, 3000);
  }
  ['pointermove','pointerdown','touchstart'].forEach(ev => stage.addEventListener(ev, showUI, { passive:true }));
  stage.addEventListener('pointerleave', () => { clearTimeout(uiTimer); uiTimer = setTimeout(() => stage.classList.remove('show-ui'), 800); });
  document.getElementById('vc').addEventListener('focusin', showUI);
  document.getElementById('vc').addEventListener('click', e => e.stopPropagation());

  // Controls
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    if (mode === 'pip' && pip === focus) pip = (focus + 1) % tiles.length;
    apply();
  }));
  document.getElementById('back10').onclick = () => { const v = tiles[focus].video; v.currentTime = Math.max(0, v.currentTime - 10); };
  document.getElementById('golive').onclick = () => { const t = tiles[focus]; const e = liveEdge(t); if (isFinite(e)) t.video.currentTime = e; t.video.play().catch(()=>{}); };
  document.getElementById('play').onclick = () => { const v = tiles[focus].video; v.paused ? v.play().catch(()=>{}) : v.pause(); };
  document.getElementById('sound').onclick = () => { soundOn = !soundOn; apply(); };
  document.getElementById('popout').onclick = async () => {
    const v = tiles[focus].video;
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else if (v.requestPictureInPicture) await v.requestPictureInPicture();
      else if (v.webkitSetPresentationMode) v.webkitSetPresentationMode('picture-in-picture');
    } catch(e) {}
  };
  document.getElementById('full').onclick = () => {
    const v = tiles[focus].video;
    if (stage.requestFullscreen) stage.requestFullscreen().catch(()=>{});
    else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') document.getElementById('back10').click();
    if (e.key === ' ') { e.preventDefault(); document.getElementById('play').click(); }
  });

  // Ticker on/off. In full screen it sits along the bottom of the video.
  const ticker = document.getElementById('ticker');
  let tickerOn = true;
  document.getElementById('tickerBtn').onclick = (e) => {
    tickerOn = !tickerOn; ticker.hidden = !tickerOn;
    e.currentTarget.setAttribute('aria-pressed', tickerOn);
    e.currentTarget.classList.toggle('primary', tickerOn);
    stage.classList.toggle('has-ticker', tickerOn && ticker.parentElement === stage);
  };
  function onFullscreen(){
    const fs = (document.fullscreenElement || document.webkitFullscreenElement) === stage;
    if (fs) stage.appendChild(ticker); else stage.after(ticker);
    stage.classList.toggle('has-ticker', fs && tickerOn);
  }
  document.addEventListener('fullscreenchange', onFullscreen);
  document.addEventListener('webkitfullscreenchange', onFullscreen);

  // ---- Live stats feed (XML) ----
  let feed = {};   // statsId -> game info from the feed
  const statusText = g => g.status === 'final' ? 'Final' : g.status === 'half' ? 'Half' : (g.period === '1' ? '1st' : '2nd') + ' ' + g.clock;

  function parseFeed(xml){
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const out = {};
    doc.querySelectorAll('game').forEach(n => {
      const team = vh => { const t = n.querySelector('team[vh="'+vh+'"]'); return { id:t.getAttribute('id'), name:t.getAttribute('name'), score:+t.getAttribute('score') }; };
      out[n.getAttribute('id')] = {
        id:n.getAttribute('id'), sport:n.getAttribute('sport'), label:n.getAttribute('label'), status:n.getAttribute('status'),
        period:n.getAttribute('period'), clock:n.getAttribute('clock'),
        away:team('V'), home:team('H'), lastplay:(n.querySelector('lastplay')||{}).textContent || ''
      };
    });
    return out;
  }

  function colorFor(statsId, side){
    const g = games.find(x => x.statsId === statsId);
    return g ? g[side].color : '#556';
  }

  function renderTicker(changed){
    const list = Object.values(feed);
    if (!list.length) return;
    const one = list.map(g => {
      const a = g.away.score, h = g.home.score;
      const cls = (x, y) => x === y ? 'lead' : (x > y ? 'lead' : 'trail');
      return '<div class="tk'+(changed.has(g.id)?' flash':'')+'" data-sid="'+esc(g.id)+'" role="button" tabindex="0" title="Watch this game">' +
        '<span class="sp">'+esc(g.sport)+'</span>' +
        '<span class="tm '+cls(a,h)+'"><span class="sw" style="background:'+esc(colorFor(g.id,'away'))+'"></span>'+esc(g.away.id)+' '+a+'</span>' +
        '<span class="tm '+cls(h,a)+'"><span class="sw" style="background:'+esc(colorFor(g.id,'home'))+'"></span>'+esc(g.home.id)+' '+h+'</span>' +
        '<span class="st'+(g.status==='live'?' live':'')+'">'+esc(statusText(g))+'</span>' +
      '</div>';
    }).join('');
    // two copies side by side so the belt loops without a gap
    document.getElementById('belt').innerHTML = '<div class="set">'+one+'</div><div class="set" aria-hidden="true">'+one+'</div>';
  }

  // Tap a game in the ticker to make it the main one
  document.getElementById('belt').addEventListener('click', e => {
    const tk = e.target.closest('.tk'); if (!tk) return;
    const i = tiles.findIndex(t => t.game.statsId === tk.dataset.sid);
    if (i < 0 || i === focus) return;
    if (mode === 'pip' && i === pip) pip = focus;
    focus = i;
    if (mode === 'pip' && pip === focus) pip = (focus + 1) % tiles.length;
    apply();
  });
  document.getElementById('belt').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.tk')) e.target.click(); });

  function applyFeed(){
    tiles.forEach(t => {
      const f = feed[t.game.statsId]; if (!f) return;
      const s = t.game.stats;
      const sa = t.el.querySelector('.sa'), sh = t.el.querySelector('.sh');
      if (s.away !== f.away.score) { sa.textContent = f.away.score; flash(sa.parentElement); }
      if (s.home !== f.home.score) { sh.textContent = f.home.score; flash(sh.parentElement); }
      s.away = f.away.score; s.home = f.home.score;
      t.el.querySelector('.clk').textContent = f.status === 'live' ? f.clock : '';
      t.el.querySelector('.c small').textContent = statusText(f).replace(' ' + f.clock, '');
    });
  }
  function flash(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

  async function pollFeed(){
    try {
      const r = await fetch(FEED, { cache:'no-store' });
      if (!r.ok) throw new Error(r.status);
      const next = parseFeed(await r.text());
      const changed = new Set(Object.keys(next).filter(id => feed[id] &&
        (feed[id].away.score !== next[id].away.score || feed[id].home.score !== next[id].home.score)));
      feed = next;
      renderTicker(changed); applyFeed();
    } catch (e) {
      if (!Object.keys(feed).length) document.getElementById('belt').innerHTML = '<div class="set"><span class="wait">Scores are not available right now.</span></div>';
    }
  }

  // Load the games list (the "database"), then build the stage
  fetch('games.json', { cache:'no-store' })
    .then(r => r.ok ? r.json() : FALLBACK)
    .catch(() => FALLBACK)
    .then(list => {
      games = list.slice(0, 4);
      if (!games.length) { document.getElementById('nowTitle').textContent = 'No games found. Check games.json.'; return; }
      tiles = games.map(buildTile);
      apply();
      pollFeed(); setInterval(pollFeed, 5000);
      showUI();
    });
})();
</script>
</body>
</html>
