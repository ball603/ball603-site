<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rosters | Farmington Tigers</title>
<meta name="description" content="Rosters for Farmington Tigers teams.">
<link rel="canonical" href="https://ball603.com/farmingtontigersnh/rosters">
<link rel="icon" href="/logos/100px/Farmington.png">
<!-- Installable app. The manifest link is set by farmington.js rather than
     written here, because its path depends on which of the two Tigers hosts you
     are on; everything below is the same either way. -->
<meta name="theme-color" content="#000000">
<!-- iOS reads these, not the manifest, and it keeps whichever one it grabbed
     when the page was first added to the Home Screen. Sizes are spelled out so
     Safari picks the right one rather than scaling the 180 down. -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/farmington/v2/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/farmington/v2/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/farmington/v2/apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/farmington/v2/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/farmington/v2/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tigers">
<link rel="stylesheet" href="/farmington.css">
</head>
<body>

<div id="ft-header"></div>

<main class="ft-wrap">
  <div class="ft-pagehead"><h1>Rosters</h1></div>

  <div class="ft-pillrow ft-center" id="sportPills"></div>
  <div class="ft-pillrow ft-center" id="genderPills"></div>
  <div class="ft-pillrow ft-center" id="levelPills"></div>
  <div class="ft-pillrow ft-center" id="seasonPills"></div>

  <div id="rosterBody"><div class="ft-loading">Loading rosters&hellip;</div></div>
</main>

<div id="ft-footer"></div>

<script src="/farmington.js"></script>
<script>
'use strict';

FT.renderHeader('rosters');
FT.renderFooter();

let LIST = [];
const state = { sport: null, gender: null, level: null, id: null };

/* Rosters are filed under Ball603's sport keys, so they have to be matched back
   to the vocabulary the rest of the site uses for emoji, name and ordering. */
function sportMeta(key) {
  const hit = Object.entries(FT.SPORTS).find(([, s]) => (s.roster || s.ball603) === key);
  // The numeric id comes back too, because the heading needs it to decide
  // whether naming the gender says anything.
  return hit ? { ...hit[1], id: Number(hit[0]) } : { name: key, emoji: '\u{1F3C6}', order: 99, id: null };
}

const sportsWithRosters = () => {
  const seen = [];
  for (const r of LIST) if (!seen.includes(r.sport)) seen.push(r.sport);
  return seen.sort((a, b) => sportMeta(a).order - sportMeta(b).order);
};

// Basketball files a Boys and a Girls roster, so the gender row earns its place
// there and is skipped everywhere else.
const gendersIn = (sport) => {
  const seen = [];
  for (const r of LIST) {
    if (r.sport === sport && r.gender && !seen.includes(r.gender)) seen.push(r.gender);
  }
  return seen.sort((a, b) => ['Boys', 'Girls', 'Coed'].indexOf(a) - ['Boys', 'Girls', 'Coed'].indexOf(b));
};

/* Level, the same row the schedule page has. roster_submissions.level is blank
   for every roster Ball603 has ever collected — its form only takes varsity —
   so blank means Varsity, and JV / Jr. High rosters carry theirs explicitly.
   The row only appears once a sport has more than one level on file. */
const LEVEL_ORDER = ['Varsity', 'JV', 'Jr. High', 'Jr. High - JV'];
const levelOf = (r) => (r.level && String(r.level).trim()) || 'Varsity';
const inGender = (sport, gender) => (r) =>
  r.sport === sport && (gendersIn(sport).length < 2 || r.gender === gender);
const levelsIn = (sport, gender) => {
  const seen = [];
  for (const r of LIST.filter(inGender(sport, gender))) if (!seen.includes(levelOf(r))) seen.push(levelOf(r));
  const rank = (l) => { const i = LEVEL_ORDER.indexOf(l); return i < 0 ? 99 : i; };
  return seen.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
};

// Newest first. A team that submits a roster every year builds a history, and
// the season row is how somebody reaches last year's.
const seasonsIn = (sport, gender, level) => LIST
  .filter(inGender(sport, gender))
  .filter(r => levelOf(r) === (level || 'Varsity'))
  .sort((a, b) => String(b.season).localeCompare(String(a.season)));

const current = () => {
  const rows = seasonsIn(state.sport, state.gender, state.level);
  return rows.find(r => String(r.id) === String(state.id)) || rows[0] || null;
};

/* Submitted rosters carry name / number / position / class. Older ones have
   used grade and height, so each column takes the first field it finds and a
   column nobody filled in is dropped rather than shown empty. */
const val = (p, fields) => {
  for (const f of fields) if (p && p[f] != null && String(p[f]).trim() !== '') return p[f];
  return '';
};

function players(r) {
  try {
    const p = typeof r.players_json === 'string' ? JSON.parse(r.players_json) : (r.players_json || []);
    return Array.isArray(p) ? p : [];
  } catch (err) {
    console.error('Roster JSON would not parse for submission ' + r.id, err);
    return [];
  }
}

/* ── Controls ──────────────────────────────────────────────────────────── */

function renderPills() {
  document.getElementById('sportPills').innerHTML = FT.pills(
    sportsWithRosters().map(k => ({ value: k, label: sportMeta(k).name, emoji: sportMeta(k).emoji })),
    state.sport, 'data-sport');

  const genders = gendersIn(state.sport);
  document.getElementById('genderPills').innerHTML = genders.length > 1
    ? FT.pills(genders.map(g => ({ value: g, label: g })), state.gender, 'data-gender')
    : '';

  const levels = levelsIn(state.sport, state.gender);
  document.getElementById('levelPills').innerHTML = levels.length > 1
    ? FT.pills(levels.map(l => ({ value: l, label: l })), state.level, 'data-level')
    : '';

  const seasons = seasonsIn(state.sport, state.gender, state.level);
  const r = current();
  document.getElementById('seasonPills').innerHTML = seasons.length > 1
    ? FT.pills(seasons.map(x => ({ value: x.id, label: x.season })), r && r.id, 'data-season')
    : '';
}

/* ── The roster ────────────────────────────────────────────────────────── */

function renderRoster() {
  const body = document.getElementById('rosterBody');
  const r = current();
  if (!r) { body.innerHTML = '<div class="ft-card"><div class="ft-empty">Nothing to show.</div></div>'; return; }

  const roster = players(r);
  /* Class before Pos: a parent scanning a roster is looking for the year first,
     and on a phone the leftmost columns are the ones that survive. */
  const cols = [
    { h: '#',      fields: ['number', 'jersey', 'no'], cls: 'num' },
    { h: 'Player', fields: ['name', 'player', 'full_name'], cls: 'grow' },
    { h: 'Class',  fields: ['class', 'grade', 'year'], cls: 'ctr tight' },
    { h: 'Pos',    fields: ['position', 'pos'], cls: 'ctr tight' },
    // Co-op squads are drawn from two schools and it matters to the families
    // which one a player is at. Only appears on a roster that says.
    { h: 'School', fields: ['school', 'from'], cls: 'ctr tight' },
    // Height is the one thing nobody came for, so it is the one that goes when
    // the screen runs out of room.
    { h: 'Ht',     fields: ['height', 'ht'], cls: 'ctr ft-hide-sm' }
  ].filter(c => c.h === 'Player' || roster.some(p => val(p, c.fields) !== ''));

  /* "Girls Varsity Volleyball", "Girls JV Volleyball": gender, level, sport.
     Gender is dropped where it distinguishes nothing, the same as everywhere
     else: "Varsity Baseball", not "Boys Varsity Baseball". */
  const meta = sportMeta(r.sport);
  const shown = FT.genderPrefix(r.gender, meta.id);
  const title = `${shown ? shown + ' ' : ''}${levelOf(r)} ${meta.name}`;
  const dot = '<i class="ft-bardot">&bull;</i>';
  const facts = [
    roster.length ? `${roster.length} <em>Players</em>` : '',
    r.division ? `<em>Div</em> ${FT.esc(r.division)}` : '',
    r.season ? `<em>Season</em> ${FT.esc(r.season)}` : ''
  ].filter(Boolean);

  const coaches = [
    r.head_coach ? `Head coach: ${FT.esc(r.head_coach)}` : '',
    r.assistant_coaches ? `Assistants: ${FT.esc(r.assistant_coaches)}` : '',
    r.managers && String(r.managers).trim() ? `Manager${/[,&]| and /.test(r.managers) ? 's' : ''}: ${FT.esc(r.managers)}` : ''
  ].filter(Boolean).join(' &nbsp;&middot;&nbsp; ');

  body.innerHTML = `
    <div class="ft-card">
      <div class="ft-cardbar">
        <h2>${FT.esc(title)}</h2>
        ${facts.length ? `<span class="ft-barstats">${facts.join(dot)}</span>` : ''}
      </div>
      ${roster.length ? `
        <div class="ft-tablewrap ft-rosterwrap">
          <table class="ft-table ft-rostertable">
            <thead><tr>${cols.map(c => `<th class="${c.cls}">${c.h}</th>`).join('')}</tr></thead>
            <tbody>${roster.map(p => `<tr>${cols.map(c =>
              `<td class="${c.cls}">${FT.esc(val(p, c.fields))}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>
        </div>`
      : '<div class="ft-empty">Roster on file, player list not available.</div>'}
      ${coaches ? `<div class="ft-coaches">${coaches}</div>` : ''}
    </div>`;
}

/* ── Wiring ────────────────────────────────────────────────────────────── */

// Choosing a sport resets the gender, for the same reason the schedule does:
// carrying "Girls" over from volleyball would open the girls basketball roster
// without anybody having asked for it.
// A new sport opens on its varsity roster (or whatever its top level is); a
// new gender keeps the level if that side has one at the same level.
function pickDefaults(keepGender, keepLevel) {
  const genders = gendersIn(state.sport);
  if (!keepGender || !genders.includes(state.gender)) state.gender = genders[0] || null;
  const levels = levelsIn(state.sport, state.gender);
  if (!keepLevel || !levels.includes(state.level)) state.level = levels[0] || 'Varsity';
  const rows = seasonsIn(state.sport, state.gender, state.level);
  state.id = rows.length ? rows[0].id : null;
}

document.getElementById('sportPills').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  state.sport = btn.dataset.sport;
  pickDefaults(false, false);
  renderPills(); renderRoster();
});

document.getElementById('genderPills').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  state.gender = btn.dataset.gender;
  pickDefaults(true, true);
  renderPills(); renderRoster();
});

document.getElementById('levelPills').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  state.level = btn.dataset.level;
  pickDefaults(true, true);
  renderPills(); renderRoster();
});

document.getElementById('seasonPills').addEventListener('click', (e) => {
  const btn = e.target.closest('.ft-pill');
  if (!btn) return;
  state.id = btn.dataset.season;
  renderPills(); renderRoster();
});

FT.load().then(data => {
  LIST = data.rosters || [];
  if (!LIST.length) {
    document.getElementById('rosterBody').innerHTML =
      '<div class="ft-card"><div class="ft-empty">No Tigers rosters have been submitted yet.</div></div>';
    return;
  }
  state.sport = sportsWithRosters()[0];
  pickDefaults(false, false);
  renderPills();
  renderRoster();
}).catch(err => {
  console.error('Tigers rosters failed to load:', err);
  document.getElementById('rosterBody').innerHTML =
    '<div class="ft-card"><div class="ft-empty">Rosters could not be loaded just now.</div></div>';
});
</script>
</body>
</html>
