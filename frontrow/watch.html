<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch · NEC Front Row</title>
<link rel="manifest" href="/frontrow/manifest.webmanifest">
<link rel="apple-touch-icon" href="/frontrow/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Front Row">
<meta name="theme-color" content="#060d1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/frontrow/assets/fr.css">
<style>
/* Player on the left, the game's scoreboard and details on the right; stacks on phones */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;padding-block:20px 0}
@media (max-width:1020px){.watch{grid-template-columns:1fr}}
.side{display:grid;gap:14px}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h2{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.score{display:grid;gap:10px}
.score .st{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
.score .tm{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px}
.score .tm img{width:44px;height:44px;object-fit:contain}
.score .nm{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05;min-width:0}
.score .nm small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.score .sc{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.score .tm.lose{opacity:.55}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.title{margin:14px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,34px);line-height:1.1;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
.wait{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center}
.wait .art{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.wait .art .pill,.wait .art .scr{display:none}
.wait .msg{position:relative;z-index:3;display:grid;gap:6px;padding:16px 22px;border-radius:12px;background:rgba(6,13,26,.78);backdrop-filter:blur(8px)}
.wait .msg b{font-family:var(--display);font-size:26px}
.wait .msg span{color:var(--muted);font-size:14px}

/* Stats tabs */
.stats{padding:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:12px 6px;border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.04em;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--nec)}
.tab:hover{color:var(--text)}
.tpanel{padding:16px}
.ls{width:100%;border-collapse:collapse;margin-top:14px;font-variant-numeric:tabular-nums;font-size:14px}
.ls th,.ls td{padding:7px 4px;text-align:center;border-top:1px solid var(--line)}
.ls th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;border-top:0}
.ls td:first-child,.ls th:first-child{text-align:left}
.ls td:first-child{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:16px}
.ls td:first-child img{width:20px;height:20px;object-fit:contain}
.ls td:last-child{font-weight:800}
.ts-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:6px;font-family:var(--display);font-weight:700;font-size:16px}
.ts-h span{display:flex;align-items:center;gap:7px}
.ts-h span:last-child{justify-content:flex-end}
.ts-h img{width:22px;height:22px;object-fit:contain}
.ts-row{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ts-row b{font-family:var(--display);font-size:18px}
.ts-row b:last-child{text-align:right}
.ts-row .lbl{display:grid;gap:5px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.ts-bar{display:flex;gap:3px;height:5px}
.ts-bar i{display:block;border-radius:3px;background:var(--nec-hi)}
.ts-bar i:last-child{background:#c9d4e5}
.ld-g{margin-top:4px}
.ld-g h3{margin:14px 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ld-g h3:first-child{margin-top:0}
.ld-r{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.ld-r img{width:26px;height:26px;object-fit:contain;grid-row:span 2}
.ld-r b{font-family:var(--display);font-size:17px;line-height:1.1}
.ld-r span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pre-note{color:var(--muted);font-size:14px;margin:14px 0 0}
/* Phones: the video (with its controls) stays pinned to the top while the page scrolls underneath,
   and the stats tabs stick right below it */
@media (max-width:1020px) and (pointer:coarse), (max-width:760px){
  .hdr{position:relative}
  .watch,.watch > div:first-child{display:contents}
  .side{margin-top:16px}
  #stage:not(.fake-fs):not(.fs){position:sticky;top:0;z-index:45;margin-inline:calc(var(--gut) * -1);border-radius:0;padding-top:env(safe-area-inset-top,0px);background:#000;box-shadow:0 8px 18px rgba(0,0,0,.45)}
  .title{margin-top:16px}
  .stats .tabs{position:sticky;top:var(--stage-h,0px);z-index:30;background:var(--bg-2);border-radius:var(--radius) var(--radius) 0 0}
  .stats{overflow:visible}
}

</style>
</head>
<body>
<a class="skip" href="#player">Skip to video</a>
<header id="hdr"></header>
<section id="board"></section>

<main class="wrap" id="main">
  <div class="watch">
    <div>
      <div class="stage" id="stage">
        <div class="screen" id="screen">
          <div class="tile" id="tile">
            <video id="player" playsinline muted aria-label="Game video"></video>
            <div class="badge"><span id="livePill"></span><span class="snd" id="sndTag" hidden aria-label="Sound on"></span></div>
          </div>
        </div>
        <button class="tapsound" id="tapSound" hidden></button>
        <div class="vc" id="vc"></div>
        <div class="mvmenu" id="mvMenu" role="menu" aria-label="Watch with other games" hidden>
          <div class="mvh">Watch with other games</div>
          <div class="mvopts">
            <button role="menuitem" data-l="pip"><svg viewBox="0 0 48 27"><rect class="m" width="48" height="27" rx="2"/><rect class="o" x="29" y="15" width="16" height="9" rx="1.5"/></svg>PiP</button>
            <button role="menuitem" data-l="two"><svg viewBox="0 0 48 27"><rect class="m" y="4" width="23.5" height="19" rx="2"/><rect class="o" x="24.5" y="4" width="23.5" height="19" rx="2"/></svg>Side by side</button>
            <button role="menuitem" data-l="three"><svg viewBox="0 0 48 27"><rect class="m" width="48" height="17.5" rx="2"/><rect class="o" y="18.5" width="23.5" height="8.5" rx="1.5"/><rect class="o" x="24.5" y="18.5" width="23.5" height="8.5" rx="1.5"/></svg>3 games</button>
            <button role="menuitem" data-l="quad"><svg viewBox="0 0 48 27"><rect class="m" width="23.5" height="13" rx="1.5"/><rect class="o" x="24.5" width="23.5" height="13" rx="1.5"/><rect class="o" y="14" width="23.5" height="13" rx="1.5"/><rect class="o" x="24.5" y="14" width="23.5" height="13" rx="1.5"/></svg>4 games</button>
          </div>
        </div>
      </div>
      <h1 class="title" id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>

    <aside class="side" aria-label="Game details">
      <section class="panel stats" aria-label="Game stats">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="t-score" aria-controls="p-score" aria-selected="true">Score</button>
          <button class="tab" role="tab" id="t-team" aria-controls="p-team" aria-selected="false" tabindex="-1">Team Stats</button>
          <button class="tab" role="tab" id="t-lead" aria-controls="p-lead" aria-selected="false" tabindex="-1">Stat Leaders</button>
        </div>
        <div class="tpanel" role="tabpanel" id="p-score" aria-labelledby="t-score"><div class="score" id="score" aria-live="polite"></div></div>
        <div class="tpanel" role="tabpanel" id="p-team" aria-labelledby="t-team" hidden></div>
        <div class="tpanel" role="tabpanel" id="p-lead" aria-labelledby="t-lead" hidden></div>
      </section>
      <a class="btn primary" id="toMulti" href="/frontrow/multiview.html"><svg viewBox="0 0 24 24"><path d="M3 4h8v7H3zm10 0h8v7h-8zM3 13h8v7H3zm10 0h8v7h-8z"/></svg>Watch with other games</a>
      <section class="panel"><h2>Game info</h2><dl class="facts" id="facts"></dl></section>
    </aside>
  </div>

  <section class="sec" aria-labelledby="h-more">
    <div class="sec-h"><h2 id="h-more">More games today</h2></div>
    <div class="rail" id="more"></div>
  </section>
</main>



<footer class="foot"><span>© 2026 Northeast Conference · NEC Front Row</span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" defer></script>
<script src="/frontrow/assets/fr.js" defer></script>
<script src="/frontrow/assets/player.js" defer></script>
<script src="/frontrow/assets/clip.js" defer></script>
<script defer>
addEventListener('DOMContentLoaded', () => {
  const { esc, logoImg, label, soon, pill, isLive, watchable, sorted, lead, time, card } = FR;
  const I = FRPlayer.ICONS;
  const $ = id => document.getElementById(id);
  FR.header('');
  FR.board($('board'));
  FR.pullToRefresh(() => $('stage').classList.contains('fake-fs'));

  $('tapSound').innerHTML = FRPlayer.ICONS.sound + 'Tap for sound';
  $('sndTag').innerHTML = FRPlayer.ICONS.sound;

  const stage = $('stage'), video = $('player');
  let ev = null, h = null, started = false, soundOn = false, tab = 'score';

  function setSound(on){
    soundOn = on; video.volume = 0.5; video.muted = !on;
    $('sndTag').hidden = !on;
    if (on) hideTap();
  }
  function hideTap(){ const b = $('tapSound'); b.classList.add('out'); setTimeout(() => b.hidden = true, 450); }
  $('tapSound').onclick = e => { e.stopPropagation(); setSound(true); };

  const bar = FRPlayer.bar({ vc: $('vc'), getH: () => h, isLiveGame: () => !!ev && isLive(ev),
    soundOn: () => soundOn, onSound: () => setSound(!soundOn),
    extra: '<button class="pb b-mv" aria-label="Watch with other games" aria-haspopup="menu" aria-expanded="false" title="Multiview"><svg viewBox="0 0 24 24"><path d="M3 5h8.5v6.5H3zm9.5 0H21v6.5h-8.5zM3 12.5h8.5V19H3zm9.5 0H21V19h-8.5z"/></svg></button><button class="pb b-clip" aria-label="Make a clip" title="Make a clip"><svg viewBox="0 0 24 24"><path d="M9.6 7.6A3.5 3.5 0 1 0 8 9.9l2.3 2.1L8 14.1a3.5 3.5 0 1 0 1.6 2.3L12 14.2l7.6 6.8H22v-1L11.7 12 22 4V3h-2.4zM6.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm0 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></button>' });
  FRPlayer.autoHide(stage, $('vc'));
  // keep the stats tabs tucked right under the pinned video
  const stageH = () => document.documentElement.style.setProperty('--stage-h', stage.getBoundingClientRect().height + 'px');
  if (window.ResizeObserver) new ResizeObserver(stageH).observe(stage); else addEventListener('resize', stageH);
  stageH();
  FRPlayer.fullscreen(stage, bar.full);
  // score ticker in full screen: tap a game to switch to it right here
  const tick = FRPlayer.ticker({ stage, vc: $('vc'), current: () => ev ? [ev.id] : [], onPick: id => switchTo(id) });
  // Multiview button: pick a layout, then open Multiview with this game in the main window
  const mvBtn = $('vc').querySelector('.b-mv'), mvMenu = $('mvMenu');
  const mvShow = on => { mvMenu.hidden = !on; mvBtn.setAttribute('aria-expanded', on); if (on) mvMenu.querySelector('button').focus(); };
  mvBtn.onclick = e => { e.stopPropagation(); mvShow(mvMenu.hidden); };
  mvMenu.addEventListener('click', e => {
    const b = e.target.closest('[data-l]'); if (!b || !ev) return;
    const fs = stage.classList.contains('fs') ? '&fs=1' : '';
    location.href = `/frontrow/multiview.html?l=${b.dataset.l}&g=${encodeURIComponent(ev.id)},${fs}`;   // trailing comma = other windows start empty
  });
  document.addEventListener('pointerdown', e => { if (!mvMenu.hidden && !e.target.closest('#mvMenu,.b-mv')) mvShow(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !mvMenu.hidden) { mvShow(false); mvBtn.focus(); } });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea,button,[role=tab]')) return;
    if (e.key === 'ArrowLeft' && h) FRPlayer.back10(h);
    if (e.key === 'ArrowRight' && h) FRPlayer.fwd10(h);
    if (e.key === ' ') { e.preventDefault(); $('vc').querySelector('.b-play').click(); }
    if (e.key === 'm') setSound(!soundOn);
    if (e.key === 'f') bar.full.click();
  });

  function start(){
    if (started || !watchable(ev)) return;
    started = true;
    stage.querySelector('.wait')?.remove();
    h = FRPlayer.attach(video, ev.stream, { main:true, liveSince: isLive(ev) ? ev.kickoff : null, onError: () => {
      $('tile').insertAdjacentHTML('beforeend', '<div class="vmsg">This video could not load. Try again in a moment.</div>'); } });
    video.addEventListener('canplay', () => FRPlayer.trySound(video).then(ok => {
      if (ok) { setSound(true); return; }
      $('tapSound').hidden = false;            // sound was blocked: offer the button, or any tap
      FRPlayer.onFirstTap(() => setSound(true));
    }), { once:true });
    setTimeout(() => $('tile').classList.add('live-off'), 4000);
    setTimeout(() => $('tile').classList.add('live-gone'), 4700);
  }

  function waiting(){
    if (stage.querySelector('.wait')) { stage.querySelector('.wait .msg span').textContent = soon(ev); return; }
    $('tile').insertAdjacentHTML('beforeend', `<div class="wait">${FR.art(ev, false)}<div class="msg"><b>Kickoff ${esc(time(ev.kickoff))}</b><span>${esc(soon(ev))}</span></div></div>`);
  }

  // ---------- Clips ----------
  FRClip.button($('vc').querySelector('.b-clip'), { stage, getH: () => h, getEv: () => ev });

  // ---------- Stats tabs ----------
  const tabs = [...document.querySelectorAll('.tab')];
  function pick(t){
    tab = t;
    tabs.forEach(b => { const on = b.id === 't-' + t; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
    ['score', 'team', 'lead'].forEach(k => $('p-' + k).hidden = k !== t);
  }
  tabs.forEach((b, i) => {
    b.onclick = () => pick(b.id.slice(2));
    b.onkeydown = e => {
      const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
      const n = tabs[(i + d + tabs.length) % tabs.length]; n.focus(); n.click();
    };
  });

  const preNote = '<p class="pre-note">Stats start at kickoff.</p>';
  function scoreTab(){
    const live = isLive(ev);
    const tm = side => { const t = side === 'away' ? ev.a : ev.h;
      return `<div class="tm ${lead(ev, side)}">${logoImg(t.key, 44)}<div class="nm">${esc(t.name)}${ev.poss === side ? ' <i class="poss" title="Has the ball"></i>' : ''}<small>${esc(t.mascot)}</small></div><div class="sc">${ev.status === 'pre' ? '–' : ev.score[side]}</div></div>`; };
    let table = '';
    if (ev.status !== 'pre' && ev.lines) {
      const q = n => ev.lines.away[n] !== undefined ? 1 : 0;
      const cols = [0, 1, 2, 3];
      const row = side => { const t = side === 'away' ? ev.a : ev.h;
        return `<tr><td>${logoImg(t.key, 20)}${esc(t.abbr)}</td>${cols.map(n => `<td>${ev.lines[side][n] ?? '–'}</td>`).join('')}<td>${ev.score[side]}</td></tr>`; };
      table = `<table class="ls"><thead><tr><th scope="col">Team</th>${cols.map(n => `<th scope="col">${n + 1}</th>`).join('')}<th scope="col">T</th></tr></thead><tbody>${row('away')}${row('home')}</tbody></table>`;
    }
    return `<div class="st">${live ? '<span class="dot"></span>' : ''}${esc(ev.status === 'pre' ? soon(ev) : label(ev))}</div>${tm('away')}${tm('home')}${table}`;
  }
  function teamTab(){
    if (ev.status === 'pre' || !ev.stats || !ev.stats.away) return preNote;
    const A = ev.stats.away, H = ev.stats.home;
    const rows = [['First downs','firstdowns'],['Total yards','totalyds'],['Passing yards','passyds'],['Rushing yards','rushyds'],['Turnovers','turnovers',true],['Penalties','penalties',true],['Time of possession','top']];
    const secs = v => typeof v === 'string' && v.includes(':') ? +v.split(':')[0] * 60 + +v.split(':')[1] : +v;
    const head = `<div class="ts-h"><span>${logoImg(ev.a.key, 22)}${esc(ev.a.abbr)}</span><span></span><span>${esc(ev.h.abbr)}${logoImg(ev.h.key, 22)}</span></div>`;
    return `<div>${head}` +
      rows.map(([name, k]) => {
        const a = secs(A[k]), b = secs(H[k]), tot = (a + b) || 1;
        return `<div class="ts-row"><b>${esc(A[k])}</b><div class="lbl">${name}<div class="ts-bar"><i style="flex:${a / tot || .001}"></i><i style="flex:${b / tot || .001}"></i></div></div><b>${esc(H[k])}</b></div>`;
      }).join('') + '</div>';
  }
  function leadTab(){
    if (ev.status === 'pre' || !ev.leaders || !ev.leaders.away) return preNote;
    const line = {
      pass: p => `${p.comp}/${p.att}, ${p.yds} yds, ${p.td} TD`,
      rush: p => `${p.car} car, ${p.yds} yds, ${p.td} TD`,
      rec:  p => `${p.rec} rec, ${p.yds} yds, ${p.td} TD`,
    };
    const group = (title, k) => `<h3>${title}</h3>` + ['away', 'home'].map(side => {
      const p = ev.leaders[side][k], t = side === 'away' ? ev.a : ev.h; if (!p) return '';
      return `<div class="ld-r">${logoImg(t.key, 26)}<b>${esc(p.name)}</b><span>${esc(t.abbr)} · ${esc(line[k](p))}</span></div>`;
    }).join('');
    return `<div class="ld-g">${group('Passing', 'pass')}${group('Rushing', 'rush')}${group('Receiving', 'rec')}</div>`;
  }

  function renderReplay(){
    const t = FR.rtitle(ev);
    document.title = `${t} · NEC Front Row`;
    $('title').textContent = t;
    $('sub').textContent = [ev.sport, FR.day(ev.date), ev.label].filter(Boolean).join(' · ');
    $('livePill').innerHTML = `<span class="pill final">${ev.kind === 'game' ? 'Replay' : ev.kind === 'show' ? 'Show' : ev.kind === 'classic' ? 'Classic' : 'Event'}</span>`;
    document.querySelector('.stats').hidden = true;
    const teams = ev.kind === 'game' ? `<dt>Teams</dt><dd>${esc(ev.a.name)}, ${esc(ev.h.name)}</dd>` : `<dt>From</dt><dd>${esc(ev.h.name)}</dd>`;
    $('facts').innerHTML = `${ev.sport ? `<dt>Sport</dt><dd>${esc(ev.sport)}</dd>` : ''}<dt>Date</dt><dd>${esc(FR.day(ev.date))}</dd>${ev.dur ? `<dt>Length</dt><dd>${esc(FR.len(ev.dur))}</dd>` : ''}${teams}${ev.label ? `<dt>Note</dt><dd>${esc(ev.label)}</dd>` : ''}`;
    $('toMulti').href = `/frontrow/multiview.html?g=${encodeURIComponent(ev.id)},`;
    start();
  }
  function render(){
    if (ev.archive) return renderReplay();
    document.querySelector('.stats').hidden = false;
    const live = isLive(ev);
    document.title = `${ev.a.name} at ${ev.h.name} · NEC Front Row`;
    $('title').textContent = `${ev.a.name} at ${ev.h.name}`;
    $('sub').textContent = `${ev.sport} · ${ev.venue}, ${ev.city}`;
    $('livePill').innerHTML = live ? pill(ev) : ev.status === 'final' ? '<span class="pill final">Replay</span>' : '';
    $('score').innerHTML = scoreTab();
    $('p-team').innerHTML = teamTab();
    $('p-lead').innerHTML = leadTab();
    $('facts').innerHTML = `<dt>Sport</dt><dd>${esc(ev.sport)}</dd><dt>Kickoff</dt><dd>${esc(time(ev.kickoff))}</dd><dt>Venue</dt><dd>${esc(ev.venue)}</dd><dt>City</dt><dd>${esc(ev.city)}</dd>`;
    $('toMulti').href = `/frontrow/multiview.html?g=${encodeURIComponent(ev.id)}`;
    if (watchable(ev)) start(); else waiting();
  }

  const more = () => {
    if (!ev.archive) { $('h-more').textContent = 'More games today'; $('more').innerHTML = sorted(FR.events).filter(x => x.id !== ev.id).map(card).join(''); return; }
    // replays: the same teams first, then more of the same sport
    const keys = [ev.a.key, ev.h.key].filter(k => k !== 'nec');
    const pool = FR.replayItems.filter(x => x.id !== ev.id);
    const same = pool.filter(x => keys.includes(x.a.key) || keys.includes(x.h.key)).filter(x => !ev.sportKey || x.sportKey === ev.sportKey);
    const sport = pool.filter(x => ev.sportKey && x.sportKey === ev.sportKey && !same.includes(x));
    $('h-more').textContent = ev.sport ? `More ${ev.sport} on demand` : 'More on demand';
    $('more').innerHTML = [...same.slice(0, 8), ...sport].slice(0, 16).map(FR.rcard).join('');
  };
  function switchTo(id){
    const next = FR.byId(id); if (!next || next === ev) return;
    FRPlayer.destroy(h); h = null; started = false; ev = next;
    $('tile').querySelectorAll('.wait,.vmsg').forEach(n => n.remove());
    $('tile').classList.remove('live-off', 'live-gone');
    history.replaceState(null, '', '?e=' + encodeURIComponent(id));
    render(); more(); tick.refresh();
  }

  const want = new URLSearchParams(location.search).get('e') || '';
  (want.startsWith('r') ? FR.replays().then(() => FR.events) : FR.load()).then(list => {
    const id = want;
    ev = FR.byId(id) || sorted(list).find(isLive) || sorted(list)[0];
    FR.on(() => { render(); more(); });
  });
});
</script>
</body>
</html>
