<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On Demand · NEC Front Row</title>
<link rel="manifest" href="/frontrow/manifest.webmanifest">
<link rel="apple-touch-icon" href="/frontrow/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Front Row">
<meta name="theme-color" content="#060d1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/frontrow/assets/fr.css">
<style>
.rp-head{padding-block:22px 6px;display:grid;gap:6px}
.rp-head h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,4vw,46px);line-height:1}
.rp-head p{margin:0;color:var(--muted)}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="hdr"></header>
<section id="board"></section>
<main id="main" class="wrap">
  <div class="rp-head"><h1>On Demand</h1><p id="sub">Every game from the past season, ready to watch.</p></div>
  <form class="rfilters" id="filters" role="search" onsubmit="return false">
    <input type="search" id="q" placeholder="Search teams, sports, events…" aria-label="Search On Demand" autocomplete="off">
    <select id="fs" aria-label="Sport"></select>
    <select id="ft" aria-label="School"></select>
    <select id="fm" aria-label="Year"></select>
    <select id="fk" aria-label="Type"><option value="">Games, shows and events</option><option value="game">Games only</option><option value="other">Shows, events and classics</option></select>
  </form>
  <div class="rgrid" id="grid"></div>
  <div class="rmore"><button class="btn" id="more" hidden>Show more</button></div>
</main>
<footer class="foot">
  <span>© 2026 Northeast Conference · NEC Front Row · <a href="/frontrow/support.html">Support &amp; FAQs</a></span>
  <a class="by" href="https://packnetwork.com" target="_blank" rel="noopener">Powered by <img src="/frontrow/packnetwork.png" alt="Pack Network" width="120" height="63" loading="lazy"></a>
</footer>

<script src="/frontrow/assets/fr.js" defer></script>
<script defer>
addEventListener('DOMContentLoaded', () => {
  const { esc, rcard } = FR;
  const $ = id => document.getElementById(id);
  FR.header('ondemand');
  FR.board($('board'));
  FR.pullToRefresh();
  const PAGE = 48;
  let all = [], shown = PAGE, list = [];
  const P = new URLSearchParams(location.search);
  const monthKey = ms => { const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const monthName = k => new Date(k + '-15').toLocaleDateString([], { month:'long', year:'numeric' });
  const words = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9& ]+/g, ' ');

  FR.replays().then(items => {
    all = items;
    items.forEach(it => it._q = words([FR.rtitle(it), it.a.name, it.h.name, it.a.abbr, it.h.abbr, it.sport, it.label, FR.day(it.date), new Date(it.date).toLocaleDateString([], { month:'long' })].join(' ')));
    // sport list (with counts), schools (NEC first), months
    const sc = {}; items.forEach(i => sc[i.sportKey] = (sc[i.sportKey] || 0) + 1);
    $('fs').innerHTML = '<option value="">All sports</option>' + FR.sports.filter(s => sc[s.key]).sort((a, b) => sc[b.key] - sc[a.key]).map(s => `<option value="${esc(s.key)}">${esc(s.name)}</option>`).join('');
    const tc = {}; items.forEach(i => { tc[i.a.key] = (tc[i.a.key] || 0) + 1; if (i.h.key !== i.a.key) tc[i.h.key] = (tc[i.h.key] || 0) + 1; });
    const byName = (a, b) => a.name.localeCompare(b.name);
    const full = FR.schools.filter(s => tc[s.key] && s.member === 'full').sort(byName);
    const assoc = FR.schools.filter(s => tc[s.key] && s.member !== 'full').sort(byName);
    const others = Object.keys(tc).filter(k => k !== 'nec' && !FR.schools.some(s => s.key === k)).map(FR.teamOf).filter(t => tc[t.key] >= 3).sort((a, b) => a.name.localeCompare(b.name));
    const opt = t => `<option value="${esc(t.key)}">${esc(t.name)}</option>`;
    $('ft').innerHTML = '<option value="">All schools</option><optgroup label="NEC members">' + full.map(opt).join('') + '</optgroup><optgroup label="NEC associate members">' + assoc.map(opt).join('') + '</optgroup><optgroup label="Other teams">' + others.map(opt).join('') + '</optgroup>';
    const months = [...new Set(items.map(i => monthKey(i.date)))];
    const years = [...new Set(items.map(i => String(new Date(i.date).getFullYear())))].sort().reverse();
    $('fm').innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('') + '<option value="all">All years</option>';
    $('q').value = P.get('q') || ''; $('fs').value = P.get('s') || ''; $('ft').value = P.get('t') || ''; $('fm').value = P.get('y') || (years.includes(String(new Date().getFullYear())) ? String(new Date().getFullYear()) : years[0]); $('fk').value = P.get('k') || '';
    $('sub').textContent = `${items.length.toLocaleString()} games, shows and events from ${months.length} months of NEC action.`;
    apply();
  });

  function apply(){
    const q = words($('q').value).trim().split(/\s+/).filter(Boolean), s = $('fs').value, t = $('ft').value, y = $('fm').value, k = $('fk').value;
    list = all.filter(i => (!s || i.sportKey === s) && (!t || i.a.key === t || i.h.key === t) && (y === 'all' || String(new Date(i.date).getFullYear()) === y)
      && (!k || (k === 'game' ? i.kind === 'game' : i.kind !== 'game')) && q.every(w => i._q.includes(w)));
    // My Teams games float up only when nothing is filtered
    shown = PAGE; render();
    const p = new URLSearchParams(); [['q', $('q').value.trim()], ['s', s], ['t', t], ['y', y === String(new Date().getFullYear()) ? '' : y], ['k', k]].forEach(([a, b]) => b && p.set(a, b));
    history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
  }
  function render(){
    if (!list.length) { $('grid').innerHTML = '<p class="rempty">Nothing matches. Try a different search or clear a filter.</p>'; $('more').hidden = true; return; }
    let last = '', html = '';
    list.slice(0, shown).forEach(it => { const mk = monthKey(it.date); if (mk !== last) { html += `<h2 class="rmonth">${esc(monthName(mk))}</h2>`; last = mk; } html += rcard(it); });
    $('grid').innerHTML = html;
    $('more').hidden = shown >= list.length;
    $('more').textContent = 'Show more';
  }
  let tmr; $('q').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(apply, 180); });
  ['fs', 'ft', 'fm', 'fk'].forEach(id => $(id).addEventListener('change', apply));
  $('more').onclick = () => { shown += PAGE; render(); };
});
</script>
</body>
</html>
