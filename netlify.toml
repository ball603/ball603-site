# Netlify configuration

[functions."sync-smugmug"]
schedule = "0 1,4,7,10,13,16,19,22 * * *"

[functions."youtube-sync"]
schedule = "0 */6 * * *"

# Farmington Tigers schedule sync.
#
# NETLIFY CRON IS UTC. These five hours are KJ's 5:30 AM, 12:30 PM, 5:30 PM,
# 9:30 PM and 11:30 PM Eastern while DAYLIGHT TIME is in effect. When EST
# begins on Nov 1, 2026, every run lands an hour early unless this becomes:
#   schedule = "30 2,4,10,17,22 * * *"
[functions."sync-farmington"]
schedule = "30 1,3,9,16,21 * * *"
timeout = 30

[functions."social-post"]
timeout = 45

[functions."generate-article"]
timeout = 60

[[edge_functions]]
function = "article-og"
path = "/article.html"

[[edge_functions]]
function = "article-og"
path = "/article/*"
