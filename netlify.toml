# Netlify configuration

# Schedule SmugMug album sync to run every 3 hours starting at 2 AM EST
# Times: 2am, 5am, 8am, 11am, 2pm, 5pm, 8pm, 11pm EST
[functions."sync-smugmug"]
schedule = "0 1,4,7,10,13,16,19,22 * * *"

[functions."youtube-sync"]
schedule = "0 */6 * * *"

[functions."social-post"]
timeout = 45

[functions."generate-article"]
timeout = 60

[[edge_functions]]
function = "article-og"
path = "/article.html"
