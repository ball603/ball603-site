# Netlify configuration

[functions."sync-smugmug"]
schedule = "0 1,4,7,10,13,16,19,22 * * *"

[functions."youtube-sync"]
schedule = "0 */6 * * *"

# Farmington Tigers schedule sync.
#
# Hourly at half past, deliberately. Netlify cron is UTC with no time zones, so
# any fixed set of hours is right for only half the year — this used to carry a
# note to change five numbers every Nov 1 and again every March. The function
# now checks Eastern time itself and does the work at 5:30am, 12:30pm, 5:30pm,
# 9:30pm and 11:30pm ET, which stays correct across both DST switches with
# nothing to remember. See the comment above the handler in sync-farmington.mjs.
[functions."sync-farmington"]
schedule = "30 * * * *"
timeout = 30

[functions."social-post"]
timeout = 45

[functions."generate-article"]
timeout = 60

[[edge_functions]]
function = "article-og"
path = "/article.html"

[[edge_functions]]
function = "article-og"
path = "/article/*"
