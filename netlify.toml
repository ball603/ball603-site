# Netlify configuration

[functions."sync-smugmug"]
schedule = "0 1,4,7,10,13,16,19,22 * * *"

[functions."youtube-sync"]
schedule = "0 */6 * * *"

[functions."social-post"]
timeout = 45

[functions."generate-article"]
timeout = 60

[[edge_functions]]
function = "article-og"
path = "/article.html"

[[edge_functions]]
function = "article-og"
path = "/article/*"
