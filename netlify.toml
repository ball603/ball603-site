# Netlify configuration

# Schedule SmugMug album sync to run at 2 AM EST (7 AM UTC)
[functions."sync-smugmug"]
schedule = "0 7 * * *"

[functions."youtube-sync"]
schedule = "0 */6 * * *"

[functions."social-post"]
timeout = 45

# RPI Rankings - calculates weekly snapshot for public page
# Runs Monday 6 AM ET (11 AM UTC)
[functions."calculate-rpi"]
schedule = "0 11 * * 1"
timeout = 60